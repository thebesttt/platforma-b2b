<title>Mockup panelu PerfectData</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Motyw PerfectData: granat i złoto ze strony perfectdata.pl, czcionka systemowa.
   Układ: nagłówek jak na stronie, niżej arkusz pomiarowy. Jedna mocna rzecz to linijka 100 punktów, reszta to spokojne wiersze na liniach. */
:root {
  color-scheme: dark;
  --ink: #0a0e1a; --panel: #0f1524; --raised: #151c2e; --line: #232d45; --line-gold: #3a3528;
  --gold: #d4a94a; --gold-hi: #e8c97a; --gold-lo: #a87f2c; --on-gold: #14100a;
  --text: #f2f3f7; --muted: #9aa3b8;
  --good: #4ade80; --mid: #f0a04b; --bad: #f87171; --bar: #34436a;
  --s1: #3987e5; --s2: #d55181; --grid: #1b2438; /* dwie serie wykresów: sprawdzone walidatorem na obu tłach, osobne od barw stanu i od złota */
  --r-s: 9px; --r-m: 14px; --r-l: 18px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ink); color: var(--text); font: 15.5px/1.6 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
a { color: var(--gold-hi); text-underline-offset: 3px; }
a:hover { color: var(--text); }
h1, h2, h3 { margin: 0; font-weight: 700; line-height: 1.15; text-wrap: balance; }
h1 { font-size: clamp(28px, 4.2vw, 44px); letter-spacing: -0.035em; }
h2 { font-size: 21px; letter-spacing: -0.02em; }
h3 { font-size: 15.5px; letter-spacing: -0.01em; }
p { margin: 0; }
ul, ol, dl, dd { margin: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 860px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

.mock { border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.mock .wrap { padding-block: 8px; }
.mock b { color: var(--gold); font-weight: 600; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(10, 14, 26, .86); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; padding-block: 12px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
.logo-mark { width: 30px; height: 30px; border: 1.5px solid var(--gold); border-radius: 7px; display: grid; place-items: center; font-size: 12px; letter-spacing: 0; color: var(--gold); }
.logo b { color: var(--gold); font-weight: 700; }
.mods { display: flex; gap: 26px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.mods::-webkit-scrollbar { display: none; }
.mods a { flex: none; white-space: nowrap; color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500; padding: 8px 0; border-bottom: 2px solid transparent; }
.mods a.on { border-bottom-color: var(--gold); }
.subnav { display: flex; gap: 24px; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--line); }
.subnav[hidden] { display: none; }
.subnav::-webkit-scrollbar { display: none; }
.subnav a { flex: none; white-space: nowrap; color: var(--muted); text-decoration: none; font-size: 13.5px; font-weight: 500; padding: 9px 0; border-bottom: 2px solid transparent; }
.subnav a.on { color: var(--text); border-bottom-color: var(--gold); }
.subnav a:hover { color: var(--gold-hi); }
.mods a:hover { color: var(--gold-hi); }
.back { font-size: 13.5px; color: var(--muted); }
.page { display: flex; flex-direction: column; gap: 28px; padding-block: 36px 72px; }
@media (max-width: 1040px) { .back { display: none; } }
@media (max-width: 860px) { .top-in { gap: 4px 28px; padding-bottom: 0; } .mods { order: 3; flex-basis: 100%; } .mods a { padding: 8px 0 10px; } }
@media (max-width: 600px) { .page { padding-block: 24px 56px; gap: 24px; } }
.client .agency-only { display: none; }

.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px 24px; }
.head-main { flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.crumbs { font-size: 13.5px; color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 12px 36px; }
.facts div { min-width: 0; max-width: 100%; }
.facts dt { font-size: 12.5px; color: var(--muted); }
.facts dd { font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 26px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs a { padding: 10px 0; font-size: 14.5px; color: var(--muted); text-decoration: none; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--text); }
.tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--gold); font-weight: 600; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border: 0; border-radius: var(--r-s); background: linear-gradient(135deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo)); color: var(--on-gold); font: 600 14.5px var(--font); cursor: pointer; text-decoration: none; }
.btn:not(.ghost) { box-shadow: 0 6px 30px rgba(212, 169, 74, .22); }
.btn:hover { filter: brightness(1.08); color: var(--on-gold); }
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--text); }
.btn.ghost:hover { border-color: var(--gold); filter: none; color: var(--text); }
.field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 220px; min-width: 0; font-size: 13.5px; font-weight: 600; }
.field input { width: 100%; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--ink); color: var(--text); font: 15px var(--font); }
.field input:focus-visible { border-color: var(--gold); outline-offset: 0; }
.form { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-m); padding: 22px; min-width: 0; }
.note { border-left: 2px solid var(--gold); background: var(--panel); padding: 10px 14px; font-size: 14px; }
.bar-row { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.switch { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; }
.switch button { border: 0; background: none; color: var(--muted); font: 14px/1.3 var(--font); padding: 6px 16px; min-height: 42px; cursor: pointer; }
.switch button span { white-space: nowrap; }
.switch button + button { border-left: 1px solid var(--line); }
.switch button[aria-pressed="true"] { color: var(--text); font-weight: 600; background: var(--raised); box-shadow: inset 0 -2px 0 var(--gold); }

/* Stan: kształt i słowo, nie sama barwa. Pełne koło, pół koła, pierścień. */
.state { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.state::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; }
.state.good { color: var(--good); } .state.good::before { background: currentColor; }
.state.mid { color: var(--mid); } .state.mid::before { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.state.bad { color: var(--bad); }
.state.hot { color: var(--gold-hi); } .state.hot::before { background: currentColor; border-radius: 2px; }
.state.talk { color: var(--text); } .state.talk::before { border-radius: 2px; background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.state.plain { color: var(--muted); } .state.plain::before { border-radius: 2px; }
.tag { display: inline-block; margin-left: 8px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; font-size: 11.5px; font-weight: 500; color: var(--muted); white-space: nowrap; vertical-align: 1px; }

/* Odczyt wyniku i linijka 100 punktów */
.readout { display: flex; flex-direction: column; gap: 22px; }
.ro-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 40px; }
.ro-score { display: flex; align-items: flex-end; gap: 16px; }
.ro-num { font-size: clamp(84px, 13vw, 132px); font-weight: 700; line-height: 0.82; letter-spacing: -0.05em; color: var(--gold); font-variant-numeric: tabular-nums; }
.ro-side { display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; }
.ro-note { flex: 1 1 320px; max-width: 62ch; color: var(--muted); font-size: 14.5px; }
.ro-note b { color: var(--bad); font-weight: 600; }
/* Złoto na linijce to zdobyte punkty, tak jak złota liczba nad nią. Czerwona ramka to wskaźnik z zerem. */
.ruler { display: flex; flex-wrap: wrap; gap: 18px 10px; }
.rg { min-width: 92px; display: flex; flex-direction: column; gap: 8px; }
.segs { display: flex; gap: 2px; }
.seg { display: block; height: 36px; min-width: 5px; padding: 0; border: 0; border-radius: 3px; background: var(--raised); overflow: hidden; }
button.seg { cursor: pointer; }
button.seg:hover, button.seg:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
.seg i { display: block; height: 100%; background: var(--gold); }
.seg.bad { box-shadow: inset 0 0 0 1.5px var(--bad); }
.rg-l { display: flex; flex-direction: column; font-size: 12.5px; line-height: 1.35; color: var(--muted); white-space: nowrap; }
.rg-l b { color: var(--gold); margin-right: 5px; }
.rg-l .num { font-size: 14px; font-weight: 600; color: var(--text); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; font-size: 13px; color: var(--muted); }
.legend .lg { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.legend .seg { width: 22px; height: 12px; border-radius: 2px; }

.sec { display: flex; flex-direction: column; }
.sec-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 20px; align-items: baseline; padding-bottom: 12px; border-bottom: 1px solid var(--line-gold); }
.sec-h p { grid-column: 1 / -1; color: var(--muted); font-size: 14px; max-width: 78ch; }
.sec-h .gid { color: var(--gold); margin-right: 10px; }
.sec-pts { font-size: 15px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.todo { list-style: none; }
.todo li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 2px 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.gain { font-size: 24px; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em; color: var(--gold); font-variant-numeric: tabular-nums; }
.gain small { font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-left: 3px; }
.todo .how { grid-column: 2; font-size: 13.5px; color: var(--muted); }
@media (max-width: 600px) { .todo li { grid-template-columns: 58px minmax(0, 1fr); gap: 2px 10px; } .gain { font-size: 21px; } .gain small { display: block; margin: 0; } }

.row { border-bottom: 1px solid var(--line); }
.row summary { display: grid; grid-template-columns: 12px 34px minmax(0, 1.1fr) minmax(0, 1.5fr) 118px 58px; gap: 4px 16px; align-items: baseline; padding: 13px 0; cursor: pointer; list-style: none; }
.row summary::-webkit-details-marker { display: none; }
.row summary::before { content: ""; align-self: center; border: 5px solid transparent; border-left-color: var(--muted); border-right-width: 0; transition: transform .12s; }
.row[open] summary::before { transform: rotate(90deg); }
.row summary:hover .c-name { color: var(--gold-hi); }
.c-code { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.c-name { font-weight: 600; }
.c-val { font-size: 14px; color: var(--muted); }
.c-pts { text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px 40px; padding: 4px 0 24px 62px; font-size: 14.5px; }
.kv { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 8px 14px; align-content: start; }
.kv dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
.thr { display: flex; flex-direction: column; gap: 2px; list-style: none; }
.thr li { display: grid; grid-template-columns: 112px minmax(0, 1fr) 46px; gap: 10px; padding: 8px 10px; border-left: 2px solid transparent; font-size: 13.5px; color: var(--muted); }
.thr li.now { border-left-color: var(--gold); background: var(--panel); color: var(--text); }
.thr .p { text-align: right; font-variant-numeric: tabular-nums; }
.basis { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
@media (max-width: 760px) {
  .row summary { grid-template-columns: 12px minmax(0, 1fr) auto; }
  .row summary .c-code { display: none; }
  .row summary .c-val { grid-column: 2 / -1; grid-row: 2; }
  .row summary .state { grid-column: 2; grid-row: 3; }
  .row summary .c-pts { grid-column: 3; grid-row: 1; }
  .row-body { grid-template-columns: minmax(0, 1fr); padding-left: 0; }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .kv dd { margin-bottom: 10px; }
  .thr li { grid-template-columns: minmax(0, 1fr) 46px; }
  .thr li .state { grid-column: 1 / -1; }
}

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 11px 16px 11px 0; border-bottom: 1px solid var(--line); }
th:last-child, td:last-child { padding-right: 0; }
thead th { font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.guide table { min-width: 880px; }
.guide td:nth-child(2) { min-width: 210px; }
.list { padding-left: 18px; display: flex; flex-direction: column; gap: 9px; max-width: 86ch; }
.list.plain { list-style: none; padding-left: 0; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 28px 40px; align-items: start; }
.two > * { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.delta { color: var(--good); font-weight: 600; }
.cmp { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 22px 24px; align-items: start; }
@media (max-width: 640px) { .cmp { grid-template-columns: minmax(0, 1fr); gap: 12px; } .cmp > .ruler { margin-bottom: 14px; } .cmp .who { display: flex; align-items: center; gap: 14px; } }
.cmp .who span { display: block; }
.cmp .big { font-size: 44px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.cmp .big.now { color: var(--gold); }
.pips { display: inline-flex; gap: 3px; margin-right: 8px; vertical-align: -1px; }
.pips i { width: 10px; height: 10px; border-radius: 2px; border: 1.5px solid var(--muted); }
.pips i.on { background: var(--text); border-color: var(--text); }
.hbar { height: 10px; border-radius: 2px; background: var(--raised); overflow: hidden; }
.hbar i { display: block; height: 100%; background: var(--bar); }
.hbar.key i { background: var(--gold); }
.meter { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; font-size: 14.5px; }
.meter .hbar { grid-column: 1 / -1; }
.qa { list-style: none; display: flex; flex-direction: column; gap: 7px; font-size: 14.5px; }
.qa li { display: grid; grid-template-columns: var(--qa, 96px) minmax(0, 1fr); gap: 12px; }
/* Pytania kwalifikatora: pytanie z lewej, odpowiedzi z punktami z prawej */
.q { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 6px 40px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.q h3 { line-height: 1.4; }
.q ul { list-style: none; }
.q li { display: flex; justify-content: space-between; gap: 16px; padding: 5px 0; }
.q li + li { border-top: 1px solid var(--line); }
.q .p { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
.q .p b { color: var(--text); }
@media (max-width: 700px) { .q { grid-template-columns: minmax(0, 1fr); } }
.kvt td:first-child { white-space: nowrap; }
.code { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-s); padding: 12px 14px; overflow-x: auto; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
code { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

/* Zapytania */
.counts { display: flex; flex-wrap: wrap; gap: 16px 0; }
.counts div { padding: 0 28px; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.counts div:first-child { padding-left: 0; border-left: 0; }
.counts b { font-size: 30px; line-height: 1.1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.counts span { font-size: 13px; color: var(--muted); }
.lead summary { grid-template-columns: 12px 52px minmax(0, 1fr) minmax(0, 1.3fr) 126px 112px; }
.l-score { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.l-who { font-weight: 600; }
.l-who span { display: block; font-weight: 400; font-size: 13.5px; color: var(--muted); }
.l-status { font-size: 13.5px; color: var(--muted); text-align: right; }
.l-status.new { color: var(--text); font-weight: 600; }
.warn { color: var(--bad); font-weight: 600; }
@media (max-width: 760px) {
  .lead summary { grid-template-columns: 12px 46px minmax(0, 1fr); }
  .lead summary .c-val, .lead summary .state, .lead summary .l-status { grid-column: 3; text-align: left; }
  .counts div { padding: 0 18px; }
}
.widget { max-width: 430px; background: var(--panel); border: 1px solid var(--line-gold); border-radius: var(--r-l); box-shadow: 0 28px 80px rgba(0, 0, 0, .27); overflow: hidden; display: flex; flex-direction: column; }
.w-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 700; letter-spacing: -0.01em; }
.w-head .logo-mark { width: 26px; height: 26px; font-size: 10.5px; }
.w-head .tag { margin-left: auto; }
.w-note { padding: 9px 16px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
.w-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 88%; padding: 9px 13px; border-radius: 14px; font-size: 14.5px; overflow-wrap: anywhere; }
.bubble.bot { background: var(--raised); align-self: flex-start; border-bottom-left-radius: 4px; }
.bubble.user { background: rgba(212, 169, 74, .12); border: 1px solid rgba(212, 169, 74, .35); align-self: flex-end; border-bottom-right-radius: 4px; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opts button { text-align: left; min-height: 42px; padding: 8px 13px; border: 1px solid var(--line); border-radius: var(--r-s); background: none; color: var(--text); font: 500 14.5px var(--font); cursor: pointer; }
.opts button:hover { border-color: var(--gold); color: var(--gold-hi); }
.w-form { display: flex; flex-direction: column; gap: 12px; }
.w-form .field { flex: none; }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; color: var(--muted); }
.check input { margin-top: 4px; accent-color: var(--gold); }
.w-foot { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.w-foot input { flex: 1; min-width: 0; min-height: 42px; padding: 0 13px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--ink); color: var(--text); font: 14.5px var(--font); }
.w-foot .btn { min-height: 42px; padding: 0 14px; }
.err { color: var(--bad); font-size: 13.5px; }
.seller-num { font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
/* ===== Nowe moduły ===== */
.field select, .field textarea { width: 100%; min-height: 44px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--ink); color: var(--text); font: 15px/1.5 var(--font); }
.field textarea { min-height: 120px; resize: vertical; }
.field select:focus-visible, .field textarea:focus-visible { border-color: var(--gold); outline-offset: 0; }
.stack > .field { flex: 0 0 auto; }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: 13.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; box-shadow: none; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
@media (max-width: 560px) { .switch.wide { display: grid; grid-template-columns: 1fr 1fr; width: 100%; } .switch.wide button:nth-child(odd) { border-left: 0; } .switch.wide button:nth-child(n+3) { border-top: 1px solid var(--line); } }

<script>
const RULES = /*__RULES__*/null;
const SAMPLE = /*__SAMPLE__*/null;
const LEADS = /*__LEADS__*/null;
const PLAT = /*__PLATFORM__*/null;

/* Mockup liczy wszystko względem jednej daty, żeby terminy i dni po terminie nie zmieniały się z dnia na dzień. */
const TODAY = new Date(PLAT.today + 'T12:00:00');
const num = (n, d = 0) => { const [a, b] = Math.abs(n).toFixed(d).split('.'); return (n < 0 ? '-' : '') + a.replace(/\B(?=(\d{3})+$)/g, '\u00a0') + (b ? ',' + b : ''); };
const zl = (n, d = 0) => num(n, d) + '\u00a0zł';
const dpl = (iso) => { const [d, t] = iso.split('T'), [y, m, dd] = d.split('-'); return `${dd}.${m}.${y}` + (t && t !== '23:59' ? ', ' + t : ''); };
const daysTo = (iso) => Math.round((new Date(iso.slice(0, 10) + 'T12:00:00') - TODAY) / 86400000);
const dni = (n) => n + (n === 1 ? ' dzień' : ' dni');
const put = (id, html) => { document.getElementById('v-' + id).innerHTML = html; };
const MODS = [], ACTIONS = {}, CHANGES = {}, FORMS = {};

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LABEL = { good: 'Dobrze', mid: 'Do poprawy', bad: 'Źle' };
const st = (s, label) => `<span class="state ${s}">${esc(label || LABEL[s])}</span>`;
/* Pierwsza litera mała, ale skrótów (LCP, JSON-LD, HTTPS) nie ruszamy. */
const lcfirst = (t) => /^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż ]/.test(t) ? t.charAt(0).toLowerCase() + t.slice(1) : t;
const REQUIRED = RULES.rules.filter((r) => r.required);
const state = { audit: 'a' };

/* Punkty liczymy z wytycznych, nigdy nie wpisujemy sum ręcznie. */
function result(rule, audit) {
  const r = SAMPLE.results[rule.code][audit];
  let status = r[0], pts;
  if (status === 'parts') {
    pts = r[3].reduce((a, b) => a + b, 0);
    status = pts === rule.max ? 'good' : (pts * 2 >= rule.max ? 'mid' : 'bad');
  } else {
    pts = status === 'good' ? rule.max : (status === 'mid' ? rule.partial : 0);
  }
  return { status, pts, value: r[1], evidence: r[2] || '' };
}
function totals(audit) {
  const g = {}; let sum = 0; const blocked = [];
  for (const gr of RULES.groups) g[gr.id] = { pts: 0, max: 0 };
  for (const rule of RULES.rules) {
    const res = result(rule, audit);
    g[rule.group].pts += res.pts; g[rule.group].max += rule.max; sum += res.pts;
    if (rule.required && res.status === 'bad') blocked.push(rule);
  }
  return { sum, g, blocked };
}
const level = (score) => score >= RULES.levels.good ? 'good' : (score >= RULES.levels.mid ? 'mid' : 'bad');
const auditOf = (id) => SAMPLE.audits.find((a) => a.id === id);
const srcLinks = (keys) => keys.map((k) => { const s = RULES.sources[k]; return `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.label)}">${esc(s.short)}</a>`; }).join(', ');
const auditSwitch = () => `<div class="switch" role="group" aria-label="Wybierz audyt">` + SAMPLE.audits.map((a) =>
  `<button type="button" data-audit="${a.id}" aria-pressed="${state.audit === a.id}"><span>${esc(a.date)},</span> <span>${esc(a.label)}</span></button>`).join('') + `</div>`;

/* Linijka 100 punktów: każdy wskaźnik to odcinek o szerokości równej jego punktom, wypełniony w takiej części, w jakiej jest zaliczony. */
function ruler(audit, interactive) {
  return `<div class="ruler" role="group" aria-label="100 punktów w podziale na wskaźniki">` + RULES.groups.map((gr) => {
    const rules = RULES.rules.filter((r) => r.group === gr.id), max = rules.reduce((a, r) => a + r.max, 0);
    let pts = 0;
    const segs = rules.map((r) => {
      const x = result(r, audit); pts += x.pts;
      const label = `${r.code} ${r.name}: ${x.pts} z ${r.max} pkt, ${LABEL[x.status]}`;
      const fill = `<i style="width:${Math.round(100 * x.pts / r.max)}%"></i>`;
      return interactive
        ? `<button type="button" class="seg ${x.status}" style="flex:${r.max}" data-rule="${r.code}" aria-label="${esc(label)}" title="${esc(label)}">${fill}</button>`
        : `<span class="seg ${x.status}" style="flex:${r.max}" title="${esc(label)}">${fill}</span>`;
    }).join('');
    return `<div class="rg" style="flex:${max} 1 ${max * 5}px"><div class="segs">${segs}</div><div class="rg-l"><span><b>${gr.id}</b>${esc(gr.short)}</span><span class="num">${pts} / ${max}</span></div></div>`;
  }).join('') + `</div>`;
}

function renderReport() {
  const t = totals(state.audit), lv = level(t.sum);
  const todo = RULES.rules.map((rule) => ({ rule, res: result(rule, state.audit) }))
    .filter((x) => x.res.pts < x.rule.max)
    .sort((x, y) => (y.rule.required && y.res.status === 'bad') - (x.rule.required && x.res.status === 'bad')
      || (y.rule.group === 'A') - (x.rule.group === 'A') || (y.rule.max - y.res.pts) - (x.rule.max - x.res.pts));
  let h = `<div class="stack agency-only" style="gap:16px">
    <form class="form" id="auditForm">
      <label class="field" for="fUrl">Adres strony<input id="fUrl" type="url" value="${esc(SAMPLE.url)}"></label>
      <label class="field" for="fPhrase">Fraza, na którą strona ma odpowiadać<input id="fPhrase" type="text" value="${esc(SAMPLE.phrase)}"></label>
      <button class="btn" type="submit">Sprawdź stronę</button>
    </form>
    <p class="note" id="formNote" hidden>W mockupie nie ma pomiaru. Po podłączeniu silnika ten przycisk uruchomi audyt i pokaże postęp kroków.</p>
  </div>
  <div class="readout">
    <div class="bar-row">${auditSwitch()}<span class="small muted">Ta sama strona i ta sama lista pytań w obu audytach.</span></div>
    <div class="ro-top">
      <div class="ro-score"><span class="ro-num">${t.sum}</span><div class="ro-side"><span class="muted">na 100 punktów</span>${st(lv)}</div></div>
      <p class="ro-note">Dobrze od ${RULES.levels.good} pkt, do poprawy od ${RULES.levels.mid} pkt. ${t.blocked.length
        ? `<b>Warunek konieczny niespełniony: ${t.blocked.map((r) => esc(r.code + ' ' + r.name)).join(', ')}.</b> Dopóki tak jest, wyszukiwarki nie pokażą tej strony albo jej fragmentu.`
        : `Warunki konieczne (${REQUIRED.map((r) => r.code).join(', ')}) są spełnione.`}</p>
    </div>
    ${ruler(state.audit, true)}
    <div class="legend"><span class="lg"><span class="seg"><i style="width:100%"></i></span>komplet punktów</span><span class="lg"><span class="seg"><i style="width:50%"></i></span>część punktów</span><span class="lg"><span class="seg bad"></span>0 punktów</span><span>Szerokość odcinka to waga wskaźnika. Kliknij odcinek, żeby go otworzyć.</span></div>
  </div>
  <div class="sec"><div class="sec-h"><h2>Najpierw to</h2><p>Najpierw dostęp dla botów, potem zadania według punktów do zdobycia. Przy każdym jest warunek, po którym wskaźnik zmieni się na „Dobrze”.</p></div>`;
  if (todo.length) {
    h += `<ol class="todo">` + todo.slice(0, 6).map((x) => `
      <li><span class="gain">+${x.rule.max - x.res.pts}<small>pkt</small></span>
        <div><b>${esc(x.rule.name)}.</b> ${esc(x.rule.fix)}</div>
        <div class="how">Teraz: ${esc(lcfirst(x.res.value))}. Zaliczymy, gdy: ${esc(lcfirst(x.rule.good))}</div></li>`).join('') + `</ol>`;
    if (todo.length > 6) h += `<p class="small muted" style="padding-top:12px">Pozostałe zadania (${todo.length - 6}) są niżej przy wskaźnikach.</p>`;
  } else {
    h += `<p style="padding-top:14px">Wszystkie wskaźniki mają komplet punktów.</p>`;
  }
  h += `</div>`;
  for (const gr of RULES.groups) {
    const x = t.g[gr.id];
    h += `<div class="sec"><div class="sec-h"><h2><span class="gid">${esc(gr.id)}</span>${esc(gr.name)}</h2><span class="sec-pts">${x.pts} / ${x.max}</span><p>${esc(gr.lead)}</p></div>`;
    for (const rule of RULES.rules.filter((r) => r.group === gr.id)) {
      const res = result(rule, state.audit);
      const thr = (s, txt, pts) => `<li${res.status === s ? ' class="now"' : ''}>${st(s)}<span>${esc(txt)}</span><span class="p">${pts}</span></li>`;
      h += `<details class="row" id="r-${rule.code}"><summary>
          <span class="c-code">${esc(rule.code)}</span>
          <span class="c-name">${esc(rule.name)}${rule.required ? '<span class="tag">konieczny</span>' : ''}${rule.ai ? '<span class="tag">ocena AI z cytatem</span>' : ''}</span>
          <span class="c-val">${esc(res.value)}</span>${st(res.status)}<span class="c-pts">${res.pts} / ${rule.max}</span></summary>
        <div class="row-body">
          <dl class="kv">
            <dt>Co mierzymy</dt><dd>${esc(rule.what)}</dd>
            <dt>Jak</dt><dd>${esc(rule.how)}</dd>
            ${res.evidence ? `<dt>Dowód</dt><dd>${esc(res.evidence)}</dd>` : ''}
            ${res.status !== 'good' ? `<dt>Co zrobić</dt><dd>${esc(rule.fix)}</dd>` : ''}
            ${rule.note ? `<dt>Uwaga</dt><dd>${esc(rule.note)}</dd>` : ''}
          </dl>
          <ul class="thr" aria-label="Progi">${thr('good', rule.good, rule.max + ' pkt')}${thr('mid', rule.mid, rule.parts ? 'po 1' : rule.partial + ' pkt')}${thr('bad', rule.bad, '0 pkt')}</ul>
          ${rule.code === 'D2' ? `<div style="grid-column:1/-1"><h3 style="margin-bottom:10px">Zamrożona lista pytań</h3><ul class="qa">` + SAMPLE.questions.map((q) => { const ok = q[state.audit === 'a' ? 1 : 2]; return `<li>${st(ok ? 'good' : 'bad', ok ? 'jest' : 'brak')}<span>${esc(q[0])}</span></li>`; }).join('') + `</ul></div>` : ''}
          <p class="basis">Podstawa: ${srcLinks(rule.basis)}.${rule.convention ? ' ' + esc(rule.convention) : ''}</p>
        </div></details>`;
    }
    h += `</div>`;
  }
  h += `<div class="sec"><div class="sec-h"><h2>Wskazówki bez punktów</h2><p>Pokazujemy je, ale nie wpływają na wynik. Wszystkie powody są w zakładce <a href="#wytyczne">Wytyczne wskaźników</a>.</p></div>
    <ul class="list" style="padding-top:16px">${RULES.unscored.slice(0, 4).map((u) => `<li><b>${esc(u.name)}.</b> ${esc(u.why)}</li>`).join('')}</ul></div>`;
  document.getElementById('v-raport').innerHTML = h;
}

function renderGuide() {
  const total = RULES.rules.reduce((a, r) => a + r.max, 0);
  let h = `<div class="sec"><div class="sec-h"><h2>Zasady punktacji</h2></div>
    <ul class="list" style="padding-top:16px">
      <li><b>${total} punktów w ${RULES.groups.length} grupach, ${RULES.rules.length} wskaźników.</b> Każdy wskaźnik ma trzy stany: „Dobrze” (komplet punktów), „Do poprawy” (część punktów) i „Źle” (0 pkt). Progi są w tabelach poniżej.</li>
      <li><b>Wynik strony:</b> ${RULES.levels.good}-100 pkt to „Dobrze”, ${RULES.levels.mid}-${RULES.levels.good - 1} pkt to „Do poprawy”, poniżej ${RULES.levels.mid} pkt to „Źle”. Te progi są umowne.</li>
      <li><b>Warunki konieczne:</b> ${REQUIRED.map((r) => esc(r.code + ' ' + r.name)).join(', ')}. Gdy któryś jest w stanie „Źle”, raport pokazuje blokadę niezależnie od liczby punktów.</li>
      <li><b>Punkty dajemy tylko za to, co ma podstawę:</b> oficjalną dokumentację Google, Microsoftu i dostawców botów AI albo opublikowane badanie. Podstawa jest przy każdym wskaźniku. Gdy sama liczba progu jest nasza, piszemy „próg umowny”.</li>
      <li><b>Ten sam pomiar daje ten sam wynik.</b> Wskaźniki liczy program według reguł z tej strony. Dwa wskaźniki (D1 i D2) ocenia model AI, zawsze z cytatem ze strony jako dowodem i z zamrożoną listą pytań.</li>
      <li><b>Brak pomiaru nie odbiera punktów.</b> Gdy wskaźnika nie da się zmierzyć (np. usługa pomiaru szybkości nie odpowiada), raport pokazuje „brak pomiaru”, a wynik liczymy proporcjonalnie z pozostałych punktów.</li>
      <li><b>Wynik nie jest obietnicą pozycji ani cytowań.</b> Google pisze, że żadne zewnętrzne narzędzie nie ma dostępu do jego systemów rankingowych i AI. Wynik mówi, czy strona spełnia opisane tu warunki.</li>
      <li><b>Wytyczne mają wersję</b> (ta: ${esc(RULES.version)}). Każdy audyt zapisuje wersję, według której był liczony. Zmiana progów to nowa wersja, a stare audyty zostają przy swojej.</li>
    </ul></div>`;
  for (const gr of RULES.groups) {
    const rules = RULES.rules.filter((r) => r.group === gr.id);
    h += `<div class="sec guide"><div class="sec-h"><h2><span class="gid">${esc(gr.id)}</span>${esc(gr.name)}</h2><span class="sec-pts">${rules.reduce((a, r) => a + r.max, 0)} pkt</span><p>${esc(gr.lead)}</p></div>
      <div class="table-wrap"><table><thead><tr><th>Kod</th><th>Wskaźnik i pomiar</th><th>Dobrze</th><th>Do poprawy</th><th>Źle</th><th class="n">Punkty</th><th>Podstawa</th></tr></thead><tbody>` +
      rules.map((r) => `<tr><td class="num muted">${esc(r.code)}</td>
        <td><b>${esc(r.name)}</b>${r.required ? '<span class="tag">konieczny</span>' : ''}${r.ai ? '<span class="tag">ocena AI</span>' : ''}<br><span class="muted">${esc(r.how)}</span>${r.note ? `<br><span class="muted">${esc(r.note)}</span>` : ''}</td>
        <td>${esc(r.good)}</td><td>${esc(r.mid)}</td><td>${esc(r.bad)}</td>
        <td class="n">${r.parts ? '2 / 1 / 0<br><span class="muted">razy 3</span>' : r.max + ' / ' + r.partial + ' / 0'}</td>
        <td>${srcLinks(r.basis)}${r.convention ? `<br><span class="muted">${esc(r.convention)}</span>` : ''}</td></tr>`).join('') + `</tbody></table></div></div>`;
  }
  h += `<div class="sec"><div class="sec-h"><h2>Czego nie punktujemy i dlaczego</h2><p>Te rzeczy bywają liczone w innych narzędziach. U nas są wskazówką, bo nie mają potwierdzenia albo źródła mówią, że nie pomagają.</p></div>
    <div class="table-wrap"><table style="min-width:640px"><thead><tr><th>Wskazówka</th><th>Dlaczego bez punktów</th><th>Źródło</th></tr></thead><tbody>` +
    RULES.unscored.map((u) => `<tr><td style="min-width:190px"><b>${esc(u.name)}</b></td><td>${esc(u.why)}</td><td>${u.basis.length ? srcLinks(u.basis) : '<span class="muted">brak</span>'}</td></tr>`).join('') + `</tbody></table></div></div>
    <div class="sec"><div class="sec-h"><h2>Źródła</h2></div><ul class="list plain small" style="padding-top:16px">` +
    Object.values(RULES.sources).map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`).join('') + `</ul></div>`;
  document.getElementById('v-wytyczne').innerHTML = h;
}

function renderProgress() {
  const [a, b] = SAMPLE.audits, ta = totals(a.id), tb = totals(b.id);
  const rows = RULES.rules.map((rule) => ({ rule, ra: result(rule, a.id), rb: result(rule, b.id) }));
  const fixed = rows.filter((x) => x.rb.pts > x.ra.pts).length, left = rows.filter((x) => x.rb.pts < x.rule.max);

function leadScore(answers, phone) {
  let pts = 0;
  const rows = LEADS.questions.map((q, i) => {
    if (answers[i] === undefined) return { label: q.label, answer: null, pts: 0, max: maxOf(q) };
    const o = q.options[answers[i]]; pts += o[1];
    return { label: q.label, answer: o[0], pts: o[1], max: maxOf(q) };
  });
  const ph = phone ? LEADS.phone_points : 0; pts += ph;
  rows.push({ label: 'Telefon', answer: phone === null ? null : (phone ? 'Podany' : 'Nie podano'), pts: ph, max: LEADS.phone_points });
  return { pts, rows };
}

function ztest(n1, x1, n2, x2) {
  const p1 = x1 / n1, p2 = x2 / n2, p = (x1 + x2) / (n1 + n2);
  return { p1, p2, z: (p2 - p1) / Math.sqrt(p * (1 - p) * (1 / n1 + 1 / n2)) };
}
function renderResults() {
  const f = LEADS.funnel, ab = LEADS.ab, t = ztest(ab.a[1], ab.a[2], ab.b[1], ab.b[2]);
  const sure = Math.abs(t.z) >= 1.96, zs = t.z.toFixed(2).replace('.', ',');
  const row = (v) => `<tr><td><b>${esc(v[0])}</b></td><td class="n">${v[1]}</td><td class="n">${v[2]}</td><td class="n"><b>${pct(v[2], v[1])}</b></td></tr>`;
  document.getElementById('v-wyniki').innerHTML = `<div class="two">
    <div class="stack"><div><h2>Lejek kwalifikatora</h2><p class="small muted" style="margin-top:6px">Ostatnie ${ab.days} dni. Procent liczony od poprzedniego kroku.</p></div>` +
      f.map((s, i) => `<div class="meter"><span>${esc(s[0])}${i ? ` <span class="small muted">${pct(s[1], f[i - 1][1])}</span>` : ''}</span><span class="num">${s[1]}</span>
        <div class="hbar${i === f.length - 1 ? ' key' : ''}"><i style="width:${Math.max(1, Math.round(100 * s[1] / f[0][1]))}%"></i></div></div>`).join('') + `</div>
    <div class="stack"><div><h2>Test: formularz czy kwalifikator</h2><p class="small muted" style="margin-top:6px">Połowa odwiedzających widzi zwykły formularz, połowa kwalifikator. Przydział jest losowy.</p></div>
      <div class="table-wrap"><table><thead><tr><th>Wariant</th><th class="n">Odsłony</th><th class="n">Zapytania</th><th class="n">Konwersja</th></tr></thead><tbody>${row(ab.a)}${row(ab.b)}</tbody></table></div>
      <p>${sure ? st('good', 'Różnica pewna') : st('mid', 'Za mało danych')}</p>
      <p>Wynik testu: z = ${zs}, próg pewności to 1,96. ${sure ? 'Można wybrać lepszy wariant.' : 'Kwalifikator ma na razie wyższą konwersję, ale taka różnica mogła wyjść przypadkiem. Test trwa dalej.'}</p></div>
    </div>
    <div class="sec"><div class="sec-h"><h2>Jak to liczymy</h2></div><ul class="list" style="padding-top:16px">
      <li><b>Konwersja</b> to liczba zapytań z kontaktem podzielona przez liczbę odsłon stron z widżetem.</li>
      <li><b>Zwycięzcę testu ogłaszamy dopiero, gdy z wynosi co najmniej 1,96</b> (pewność 95%). Wcześniej raport pisze „za mało danych”.</li>
      <li><b>Nie obiecujemy procentu wzrostu.</b> Wynik zależy od strony i ruchu, dlatego mierzymy go testem na Twojej stronie.</li>
      <li>Wariant przydziela serwer, bez plików cookie.</li></ul></div>`;
}

/* ===== Moduły ===== */
MODS.push({ id: 'zapytania', group: 'sprzedaz', order: 2, label: 'Zapytania', about: 'Kwalifikator na stronie zamiast formularza: ocena zapytania z jawnych zasad, sprawdzenie firmy, czat AI i test na liczbach.',
  head: () => ({ crumbs: 'Zapytania ze strony', title: 'Zapytania z perfectdata.pl', facts: [['Widżet działa na', LEADS.pages], ['Zasady kwalifikacji', 'wersja ' + LEADS.version]] }),
  views: [{ id: 'zapytania', label: 'Zapytania', gap: 32, render: renderLeads }, { id: 'kwalifikator', label: 'Zasady kwalifikacji', gap: 44, render: renderQualifier },
    { id: 'widzet', label: 'Podgląd widżetu', gap: 0, render: renderWidget }, { id: 'wyniki', label: 'Wyniki', gap: 44, render: renderResults }] });
MODS.push({ id: 'audyt', group: 'marketing', order: 4, label: 'Audyt AI', client: true, about: 'Audyt treści pod wyszukiwarki i AI: 24 wskaźniki, 100 punktów, lista zadań, porównanie przed i po, raport dla klienta.',
  head: () => ({ crumbs: 'Audyt treści pod wyszukiwarki i AI', title: SAMPLE.title,
    facts: [['Klient', SAMPLE.client], ['Adres', SAMPLE.url], ['Fraza', SAMPLE.phrase], ['Audyt z', auditOf(state.audit).date], ['Wytyczne', 'wersja ' + RULES.version]] }),
  views: [{ id: 'raport', label: 'Raport', gap: 44, render: renderReport }, { id: 'wytyczne', label: 'Wytyczne wskaźników', gap: 44, render: renderGuide },
    { id: 'postep', label: 'Przed i po', gap: 36, render: renderProgress }, { id: 'cytowania', label: 'Cytowania w AI', gap: 36, render: renderCitations },
    { id: 'strony', label: 'Strony witryny', agency: true, render: renderPages }] });

/*__VIEWS__*/

/* ===== Nawigacja ===== */
MODS.sort((a, b) => a.order - b.order);
const START = 'pulpit';
const allViews = () => MODS.flatMap((m) => m.views.map((v) => ({ m, v })));
function rerender(...ids) { for (const { v } of allViews()) if (ids.includes(v.id)) v.render(); drawCharts(); }
function current() {
  const h = location.hash.slice(1), all = allViews();
  return all.find((x) => x.v.id === h) || all.find((x) => x.v.id === START);
}
function setClient(on) {
  document.getElementById('shell').classList.toggle('client', on);
  document.getElementById('clientNote').hidden = !on;
  document.getElementById('clientBtn').textContent = on ? 'Wróć do widoku agencji' : 'Podgląd dla klienta';
}
let lastView = null;
function show() {
  const { m, v } = current();
  if (!m.client) setClient(false);
  for (const x of allViews()) document.getElementById('v-' + x.v.id).hidden = x.v.id !== v.id;
  const nav = document.getElementById('mods');
  for (const a of nav.querySelectorAll('a')) {
    const on = a.dataset.group === m.group;
    a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
  }
  const sub = document.getElementById('submods'), inGroup = groupMods(m.group);
  sub.hidden = inGroup.length < 2;
  sub.innerHTML = inGroup.map((x) => `<a href="#${x.views[0].id}" data-mod="${x.id}"${x.id === m.id ? ' class="on" aria-current="true"' : ''}>${esc(x.label)}</a>`).join('');
  const tabs = document.getElementById('tabs');
  tabs.hidden = m.views.length < 2;
  tabs.innerHTML = m.views.map((x) => `<a href="#${x.id}"${x.agency ? ' class="agency-only"' : ''}${x.id === v.id ? ' aria-current="page"' : ''}>${esc(x.label)}</a>`).join('');
  document.getElementById('clientBtn').hidden = !m.client;
  const h = m.head(v);
  document.getElementById('crumbs').textContent = h.crumbs;
  document.getElementById('pageTitle').textContent = h.title;
  const meta = document.getElementById('pageMeta');
  meta.hidden = !(h.facts && h.facts.length);
  meta.innerHTML = (h.facts || []).map(([k, val]) => `<div><dt>${esc(k)}</dt><dd>${esc(val)}</dd></div>`).join('');
  const on = nav.querySelector('a.on');
  if (on && (on.offsetLeft < nav.scrollLeft + nav.offsetLeft || on.offsetLeft + on.offsetWidth > nav.offsetLeft + nav.scrollLeft + nav.clientWidth)) nav.scrollLeft = on.offsetLeft - nav.offsetLeft - 16;
  if (lastView && lastView !== v.id) window.scrollTo(0, 0);
  lastView = v.id;
  hideTip(); drawCharts();
}
function renderAll() { for (const { v } of allViews()) v.render(); show(); }
function go(view) { if (location.hash === '#' + view) show(); else location.hash = '#' + view; }

/* Menu główne ma sześć pozycji w kolejności pracy: pulpit, sprzedaż, marketing, przetargi i dotacje, kontrahenci, konto.
   Grupa z kilkoma modułami pokazuje je w drugim wierszu. Zakładki ekranu zostają pod tytułem strony. */
const GROUPS = { start: 'Pulpit', sprzedaz: 'Sprzedaż', marketing: 'Marketing', zamowienia: 'Przetargi i dotacje', firmy: 'Kontrahenci', konto: 'Konto' };
const GROUP_IDS = [...new Set(MODS.map((m) => m.group))];
const groupMods = (g) => MODS.filter((m) => m.group === g);
document.getElementById('mods').innerHTML = GROUP_IDS.map((g) => `<a href="#${groupMods(g)[0].views[0].id}" data-group="${g}">${esc(GROUPS[g])}</a>`).join('');
document.getElementById('views').innerHTML = allViews().map(({ v }) => `<section id="v-${v.id}"${v.gap === 0 ? '' : ` class="stack" style="gap:${v.gap || 36}px"`} aria-label="${esc(v.label)}" hidden></section>`).join('');

document.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]');
  if (act && ACTIONS[act.dataset.act]) { ACTIONS[act.dataset.act](act, e); return; }
  const b = e.target.closest('[data-audit]');
  if (b) { state.audit = b.dataset.audit; rerender('raport', 'wytyczne', 'postep', 'cytowania', 'strony'); show(); return; }
  const seg = e.target.closest('[data-rule]');
  if (seg) { const row = document.getElementById('r-' + seg.dataset.rule); if (row) { row.open = true; row.scrollIntoView({ block: 'center' }); row.querySelector('summary').focus({ preventScroll: true }); } return; }
  const opt = e.target.closest('[data-opt]');
  if (opt) { state.w.answers.push(Number(opt.dataset.opt)); state.w.step++; renderWidget(); return; }
  if (e.target.closest('[data-skip]')) { state.w.shop = null; state.w.step = 5; renderWidget(); return; }
  if (e.target.closest('[data-restart]')) { state.w = W0(); renderWidget(); return; }
  const note = e.target.closest('[data-note]');
  if (note) note.nextElementSibling.hidden = !note.nextElementSibling.hidden;
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-on]');
  if (el && CHANGES[el.dataset.on]) CHANGES[el.dataset.on](el, e);
});
document.addEventListener('submit', (e) => {
  if (FORMS[e.target.id]) { e.preventDefault(); FORMS[e.target.id](e.target); return; }
  const w = state.w, val = (id) => document.getElementById(id).value.trim();
  if (e.target.id === 'auditForm') { e.preventDefault(); document.getElementById('formNote').hidden = false; }
  if (e.target.id === 'wShop') { e.preventDefault(); w.shop = val('wUrl').slice(0, 120) || null; w.step = 5; renderWidget(); }
  if (e.target.id === 'wAsk') { e.preventDefault(); const t = val('wQ').slice(0, 200); if (t) { w.asked.push(t); renderWidget(); } }
  if (e.target.id === 'wContact') {
    e.preventDefault();
    const email = val('wEmail');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      w.error = 'Podaj adres e-mail, żebyśmy mogli odpowiedzieć.';
      const ids = ['wName', 'wPhone', 'wNip'], keep = ids.map(val), c = document.getElementById('wConsent').checked;
      renderWidget();
      ids.forEach((id, i) => { document.getElementById(id).value = keep[i]; });
      document.getElementById('wConsent').checked = c; document.getElementById('wEmail').focus();
      return;
    }
    w.error = ''; w.email = email.slice(0, 120); w.phone = val('wPhone') !== '';
    LEADS.leads.unshift({
      at: 'przed chwilą', company: 'Zapytanie z podglądu widżetu', person: val('wName').slice(0, 60) || 'Bez imienia', email: w.email, phone: w.phone,
      answers: w.answers.slice(), status: 'Nowe', consent: document.getElementById('wConsent').checked, page: 'podgląd widżetu',
      nip: val('wNip') ? ['plain', 'NIP podany. W panelu sprawdzimy go w wykazie VAT i KRS.'] : null, shop: w.shop, audit: null,
      summary: 'Zapytanie utworzone w podglądzie widżetu. W panelu streszczenie pisze AI na podstawie odpowiedzi.',
    });
    w.step = 6; rerender('zapytania', 'widzet', 'pulpit');
  }
});
document.getElementById('clientBtn').addEventListener('click', () => {
  const on = !document.getElementById('shell').classList.contains('client');
  setClient(on);
  if (on && location.hash === '#strony') location.hash = '#raport';
});
window.addEventListener('hashchange', show);
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCharts, 120); });
renderAll();
</script>
