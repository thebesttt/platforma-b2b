<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mockup panelu PerfectData</title>
<style>
/* Motyw PerfectData: granat i złoto ze strony perfectdata.pl, czcionka systemowa.
   Układ: nagłówek jak na stronie, niżej arkusz pomiarowy. Jedna mocna rzecz to linijka 100 punktów, reszta to spokojne wiersze na liniach. */
:root {
  color-scheme: dark;
  --ink: #0a0e1a; --panel: #0f1524; --raised: #151c2e; --line: #232d45; --line-gold: #3a3528;
  --gold: #d4a94a; --gold-hi: #e8c97a; --gold-lo: #a87f2c; --on-gold: #14100a;
  --text: #f2f3f7; --muted: #9aa3b8;
  --good: #4ade80; --mid: #f0a04b; --bad: #f87171; --bar: #34436a;
  --s1: #3987e5; --s2: #d55181; --grid: #1b2438; /* dwie serie wykresów: sprawdzone walidatorem na obu tłach, osobne od barw stanu i od złota */
  --r-s: 9px; --r-m: 14px; --r-l: 18px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ink); color: var(--text); font: 15.5px/1.6 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
a { color: var(--gold-hi); text-underline-offset: 3px; }
a:hover { color: var(--text); }
h1, h2, h3 { margin: 0; font-weight: 700; line-height: 1.15; text-wrap: balance; }
h1 { font-size: clamp(28px, 4.2vw, 44px); letter-spacing: -0.035em; }
h2 { font-size: 21px; letter-spacing: -0.02em; }
h3 { font-size: 15.5px; letter-spacing: -0.01em; }
p { margin: 0; }
ul, ol, dl, dd { margin: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 3px; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 860px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

.mock { border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.mock .wrap { padding-block: 8px; }
.mock b { color: var(--gold); font-weight: 600; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(10, 14, 26, .86); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px 28px; flex-wrap: wrap; padding-block: 12px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
.logo-mark { width: 30px; height: 30px; border: 1.5px solid var(--gold); border-radius: 7px; display: grid; place-items: center; font-size: 12px; letter-spacing: 0; color: var(--gold); }
.logo b { color: var(--gold); font-weight: 700; }
.mods { display: flex; gap: 20px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.mods::-webkit-scrollbar { display: none; }
.mods a { flex: none; white-space: nowrap; color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500; padding: 8px 0; border-bottom: 2px solid transparent; }
.mods a.on { border-bottom-color: var(--gold); }
.mods a:hover { color: var(--gold-hi); }
.back { font-size: 13.5px; color: var(--muted); }
.page { display: flex; flex-direction: column; gap: 28px; padding-block: 36px 72px; }
@media (max-width: 1040px) { .back { display: none; } }
@media (max-width: 860px) { .top-in { gap: 4px 28px; padding-bottom: 0; } .mods { order: 3; flex-basis: 100%; } .mods a { padding: 8px 0 10px; } }
@media (max-width: 600px) { .page { padding-block: 24px 56px; gap: 24px; } }
.client .agency-only { display: none; }

.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px 24px; }
.head-main { flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.crumbs { font-size: 13.5px; color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 12px 36px; }
.facts div { min-width: 0; max-width: 100%; }
.facts dt { font-size: 12.5px; color: var(--muted); }
.facts dd { font-size: 14.5px; font-weight: 600; overflow-wrap: anywhere; }
.tabs { display: flex; gap: 26px; overflow-x: auto; border-bottom: 1px solid var(--line); }
.tabs a { padding: 10px 0; font-size: 14.5px; color: var(--muted); text-decoration: none; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--text); }
.tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--gold); font-weight: 600; }

.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border: 0; border-radius: var(--r-s); background: linear-gradient(135deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo)); color: var(--on-gold); font: 600 14.5px var(--font); cursor: pointer; text-decoration: none; }
.btn:not(.ghost) { box-shadow: 0 6px 30px rgba(212, 169, 74, .22); }
.btn:hover { filter: brightness(1.08); color: var(--on-gold); }
.btn.ghost { background: none; border: 1px solid var(--line); color: var(--text); }
.btn.ghost:hover { border-color: var(--gold); filter: none; color: var(--text); }
.field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 220px; min-width: 0; font-size: 13.5px; font-weight: 600; }
.field input { width: 100%; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--ink); color: var(--text); font: 15px var(--font); }
.field input:focus-visible { border-color: var(--gold); outline-offset: 0; }
.form { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-m); padding: 22px; min-width: 0; }
.note { border-left: 2px solid var(--gold); background: var(--panel); padding: 10px 14px; font-size: 14px; }
.bar-row { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; }
.switch { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; }
.switch button { border: 0; background: none; color: var(--muted); font: 14px/1.3 var(--font); padding: 6px 16px; min-height: 42px; cursor: pointer; }
.switch button span { white-space: nowrap; }
.switch button + button { border-left: 1px solid var(--line); }
.switch button[aria-pressed="true"] { color: var(--text); font-weight: 600; background: var(--raised); box-shadow: inset 0 -2px 0 var(--gold); }

/* Stan: kształt i słowo, nie sama barwa. Pełne koło, pół koła, pierścień. */
.state { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.state::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid currentColor; flex: none; }
.state.good { color: var(--good); } .state.good::before { background: currentColor; }
.state.mid { color: var(--mid); } .state.mid::before { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.state.bad { color: var(--bad); }
.state.hot { color: var(--gold-hi); } .state.hot::before { background: currentColor; border-radius: 2px; }
.state.talk { color: var(--text); } .state.talk::before { border-radius: 2px; background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.state.plain { color: var(--muted); } .state.plain::before { border-radius: 2px; }
.tag { display: inline-block; margin-left: 8px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; font-size: 11.5px; font-weight: 500; color: var(--muted); white-space: nowrap; vertical-align: 1px; }

/* Odczyt wyniku i linijka 100 punktów */
.readout { display: flex; flex-direction: column; gap: 22px; }
.ro-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 40px; }
.ro-score { display: flex; align-items: flex-end; gap: 16px; }
.ro-num { font-size: clamp(84px, 13vw, 132px); font-weight: 700; line-height: 0.82; letter-spacing: -0.05em; color: var(--gold); font-variant-numeric: tabular-nums; }
.ro-side { display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; }
.ro-note { flex: 1 1 320px; max-width: 62ch; color: var(--muted); font-size: 14.5px; }
.ro-note b { color: var(--bad); font-weight: 600; }
/* Złoto na linijce to zdobyte punkty, tak jak złota liczba nad nią. Czerwona ramka to wskaźnik z zerem. */
.ruler { display: flex; flex-wrap: wrap; gap: 18px 10px; }
.rg { min-width: 92px; display: flex; flex-direction: column; gap: 8px; }
.segs { display: flex; gap: 2px; }
.seg { display: block; height: 36px; min-width: 5px; padding: 0; border: 0; border-radius: 3px; background: var(--raised); overflow: hidden; }
button.seg { cursor: pointer; }
button.seg:hover, button.seg:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }
.seg i { display: block; height: 100%; background: var(--gold); }
.seg.bad { box-shadow: inset 0 0 0 1.5px var(--bad); }
.rg-l { display: flex; flex-direction: column; font-size: 12.5px; line-height: 1.35; color: var(--muted); white-space: nowrap; }
.rg-l b { color: var(--gold); margin-right: 5px; }
.rg-l .num { font-size: 14px; font-weight: 600; color: var(--text); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; font-size: 13px; color: var(--muted); }
.legend .lg { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.legend .seg { width: 22px; height: 12px; border-radius: 2px; }

.sec { display: flex; flex-direction: column; }
.sec-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 20px; align-items: baseline; padding-bottom: 12px; border-bottom: 1px solid var(--line-gold); }
.sec-h p { grid-column: 1 / -1; color: var(--muted); font-size: 14px; max-width: 78ch; }
.sec-h .gid { color: var(--gold); margin-right: 10px; }
.sec-pts { font-size: 15px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.todo { list-style: none; }
.todo li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 2px 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.gain { font-size: 24px; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em; color: var(--gold); font-variant-numeric: tabular-nums; }
.gain small { font-size: 13px; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-left: 3px; }
.todo .how { grid-column: 2; font-size: 13.5px; color: var(--muted); }
@media (max-width: 600px) { .todo li { grid-template-columns: 58px minmax(0, 1fr); gap: 2px 10px; } .gain { font-size: 21px; } .gain small { display: block; margin: 0; } }

.row { border-bottom: 1px solid var(--line); }
.row summary { display: grid; grid-template-columns: 12px 34px minmax(0, 1.1fr) minmax(0, 1.5fr) 118px 58px; gap: 4px 16px; align-items: baseline; padding: 13px 0; cursor: pointer; list-style: none; }
.row summary::-webkit-details-marker { display: none; }
.row summary::before { content: ""; align-self: center; border: 5px solid transparent; border-left-color: var(--muted); border-right-width: 0; transition: transform .12s; }
.row[open] summary::before { transform: rotate(90deg); }
.row summary:hover .c-name { color: var(--gold-hi); }
.c-code { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.c-name { font-weight: 600; }
.c-val { font-size: 14px; color: var(--muted); }
.c-pts { text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px 40px; padding: 4px 0 24px 62px; font-size: 14.5px; }
.kv { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 8px 14px; align-content: start; }
.kv dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
.thr { display: flex; flex-direction: column; gap: 2px; list-style: none; }
.thr li { display: grid; grid-template-columns: 112px minmax(0, 1fr) 46px; gap: 10px; padding: 8px 10px; border-left: 2px solid transparent; font-size: 13.5px; color: var(--muted); }
.thr li.now { border-left-color: var(--gold); background: var(--panel); color: var(--text); }
.thr .p { text-align: right; font-variant-numeric: tabular-nums; }
.basis { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
@media (max-width: 760px) {
  .row summary { grid-template-columns: 12px minmax(0, 1fr) auto; }
  .row summary .c-code { display: none; }
  .row summary .c-val { grid-column: 2 / -1; grid-row: 2; }
  .row summary .state { grid-column: 2; grid-row: 3; }
  .row summary .c-pts { grid-column: 3; grid-row: 1; }
  .row-body { grid-template-columns: minmax(0, 1fr); padding-left: 0; }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .kv dd { margin-bottom: 10px; }
  .thr li { grid-template-columns: minmax(0, 1fr) 46px; }
  .thr li .state { grid-column: 1 / -1; }
}

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 11px 16px 11px 0; border-bottom: 1px solid var(--line); }
th:last-child, td:last-child { padding-right: 0; }
thead th { font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.guide table { min-width: 880px; }
.guide td:nth-child(2) { min-width: 210px; }
.list { padding-left: 18px; display: flex; flex-direction: column; gap: 9px; max-width: 86ch; }
.list.plain { list-style: none; padding-left: 0; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 28px 40px; align-items: start; }
.two > * { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.delta { color: var(--good); font-weight: 600; }
.cmp { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 22px 24px; align-items: start; }
@media (max-width: 640px) { .cmp { grid-template-columns: minmax(0, 1fr); gap: 12px; } .cmp > .ruler { margin-bottom: 14px; } .cmp .who { display: flex; align-items: center; gap: 14px; } }
.cmp .who span { display: block; }
.cmp .big { font-size: 44px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.cmp .big.now { color: var(--gold); }
.pips { display: inline-flex; gap: 3px; margin-right: 8px; vertical-align: -1px; }
.pips i { width: 10px; height: 10px; border-radius: 2px; border: 1.5px solid var(--muted); }
.pips i.on { background: var(--text); border-color: var(--text); }
.hbar { height: 10px; border-radius: 2px; background: var(--raised); overflow: hidden; }
.hbar i { display: block; height: 100%; background: var(--bar); }
.hbar.key i { background: var(--gold); }
.meter { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; font-size: 14.5px; }
.meter .hbar { grid-column: 1 / -1; }
.qa { list-style: none; display: flex; flex-direction: column; gap: 7px; font-size: 14.5px; }
.qa li { display: grid; grid-template-columns: var(--qa, 96px) minmax(0, 1fr); gap: 12px; }
/* Pytania kwalifikatora: pytanie z lewej, odpowiedzi z punktami z prawej */
.q { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 6px 40px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.q h3 { line-height: 1.4; }
.q ul { list-style: none; }
.q li { display: flex; justify-content: space-between; gap: 16px; padding: 5px 0; }
.q li + li { border-top: 1px solid var(--line); }
.q .p { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
.q .p b { color: var(--text); }
@media (max-width: 700px) { .q { grid-template-columns: minmax(0, 1fr); } }
.kvt td:first-child { white-space: nowrap; }
.code { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-s); padding: 12px 14px; overflow-x: auto; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
code { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

/* Zapytania */
.counts { display: flex; flex-wrap: wrap; gap: 16px 0; }
.counts div { padding: 0 28px; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
.counts div:first-child { padding-left: 0; border-left: 0; }
.counts b { font-size: 30px; line-height: 1.1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.counts span { font-size: 13px; color: var(--muted); }
.lead summary { grid-template-columns: 12px 52px minmax(0, 1fr) minmax(0, 1.3fr) 126px 112px; }
.l-score { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.l-who { font-weight: 600; }
.l-who span { display: block; font-weight: 400; font-size: 13.5px; color: var(--muted); }
.l-status { font-size: 13.5px; color: var(--muted); text-align: right; }
.l-status.new { color: var(--text); font-weight: 600; }
.warn { color: var(--bad); font-weight: 600; }
@media (max-width: 760px) {
  .lead summary { grid-template-columns: 12px 46px minmax(0, 1fr); }
  .lead summary .c-val, .lead summary .state, .lead summary .l-status { grid-column: 3; text-align: left; }
  .counts div { padding: 0 18px; }
}
.widget { max-width: 430px; background: var(--panel); border: 1px solid var(--line-gold); border-radius: var(--r-l); box-shadow: 0 28px 80px rgba(0, 0, 0, .27); overflow: hidden; display: flex; flex-direction: column; }
.w-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 700; letter-spacing: -0.01em; }
.w-head .logo-mark { width: 26px; height: 26px; font-size: 10.5px; }
.w-head .tag { margin-left: auto; }
.w-note { padding: 9px 16px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
.w-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 88%; padding: 9px 13px; border-radius: 14px; font-size: 14.5px; overflow-wrap: anywhere; }
.bubble.bot { background: var(--raised); align-self: flex-start; border-bottom-left-radius: 4px; }
.bubble.user { background: rgba(212, 169, 74, .12); border: 1px solid rgba(212, 169, 74, .35); align-self: flex-end; border-bottom-right-radius: 4px; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opts button { text-align: left; min-height: 42px; padding: 8px 13px; border: 1px solid var(--line); border-radius: var(--r-s); background: none; color: var(--text); font: 500 14.5px var(--font); cursor: pointer; }
.opts button:hover { border-color: var(--gold); color: var(--gold-hi); }
.w-form { display: flex; flex-direction: column; gap: 12px; }
.w-form .field { flex: none; }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: 13.5px; color: var(--muted); }
.check input { margin-top: 4px; accent-color: var(--gold); }
.w-foot { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.w-foot input { flex: 1; min-width: 0; min-height: 42px; padding: 0 13px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--ink); color: var(--text); font: 14.5px var(--font); }
.w-foot .btn { min-height: 42px; padding: 0 14px; }
.err { color: var(--bad); font-size: 13.5px; }
.seller-num { font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
/* ===== Nowe moduły ===== */
.field select, .field textarea { width: 100%; min-height: 44px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--ink); color: var(--text); font: 15px/1.5 var(--font); }
.field textarea { min-height: 120px; resize: vertical; }
.field select:focus-visible, .field textarea:focus-visible { border-color: var(--gold); outline-offset: 0; }
.stack > .field { flex: 0 0 auto; }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: 13.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; box-shadow: none; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
@media (max-width: 560px) { .switch.wide { display: grid; grid-template-columns: 1fr 1fr; width: 100%; } .switch.wide button:nth-child(odd) { border-left: 0; } .switch.wide button:nth-child(n+3) { border-top: 1px solid var(--line); } }
.note.warn { border-left-color: var(--bad); }
.pick { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.pick label { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 2px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-s); cursor: pointer; font-weight: 600; }
.pick label:has(input:checked) { border-color: var(--gold); background: var(--panel); }
.pick input { accent-color: var(--gold); margin-top: 5px; }
.pick small { grid-column: 2; font-size: 13px; font-weight: 400; color: var(--muted); }
.msg { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-s); padding: 14px 16px; white-space: pre-wrap; font-size: 14.5px; overflow-wrap: anywhere; }
.msg b { display: block; margin-bottom: 8px; }
.src { color: var(--muted); font-size: 12.5px; }
.chk { color: var(--mid); font-size: 12.5px; font-weight: 600; white-space: nowrap; border-bottom: 1px dashed currentColor; }
.doc p { margin-bottom: 8px; max-width: 86ch; }
.step-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.step-h .n { color: var(--gold); font-weight: 700; }
/* Wiersz listy: lewa kolumna stała, treść, stan, akcja */
.item { display: grid; grid-template-columns: var(--c1, 132px) minmax(0, 1fr) auto; gap: 4px 20px; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--line); }
.item > .lead-col { font-size: 13.5px; color: var(--muted); }
.item p + p { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.item .end { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: flex-end; }
.item .big { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; }
@media (max-width: 700px) { .item { grid-template-columns: minmax(0, 1fr); } .item .end { justify-content: flex-start; } }
.score-line { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.debt summary { grid-template-columns: 12px 70px minmax(0, 1.3fr) minmax(0, .6fr) 190px 150px; }
@media (max-width: 760px) { .debt summary { grid-template-columns: 12px 60px minmax(0, 1fr); } }
.fn > a { color: var(--text); font-weight: 600; text-decoration-color: var(--line); }
.fn > a:hover { color: var(--gold-hi); text-decoration-color: currentColor; }
.own td { background: var(--panel); }
.own td:first-child { box-shadow: inset 2px 0 0 var(--gold); padding-left: 12px; }
.delta.neg { color: var(--bad); }
/* Wykres: jedna oś, cienkie linie, opisy w barwie tekstu, nie serii */
.chart { min-width: 0; }
.chart svg { display: block; width: 100%; overflow: visible; outline-offset: 4px; }
.chart text { font: 12px var(--font); fill: var(--muted); font-variant-numeric: tabular-nums; }
.chart .val { fill: var(--text); font-weight: 600; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13.5px; }
.key { display: inline-flex; align-items: center; gap: 8px; }
.key i { width: 16px; height: 3px; border-radius: 2px; flex: none; }
.tip { position: fixed; z-index: 20; pointer-events: none; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-s); padding: 8px 12px; font-size: 13px; box-shadow: 0 12px 32px rgba(0, 0, 0, .4); max-width: 240px; }
.tip b { display: block; margin-bottom: 4px; color: var(--muted); font-weight: 500; }
.tip div { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tip div strong { font-variant-numeric: tabular-nums; }
.tip i { width: 12px; height: 3px; border-radius: 2px; flex: none; }
details.more > summary { cursor: pointer; font-size: 13.5px; color: var(--muted); padding: 6px 0; }
details.more > summary:hover { color: var(--text); }
@media (prefers-reduced-motion: reduce) { .row summary::before { transition: none; } }
</style>
</head>

<script>
const RULES = {"version":"2026-11-20","levels":{"good":85,"mid":60},"sources":{"g_guide":{"who":"Google","label":"Google: optymalizacja pod funkcje generatywnej AI w wyszukiwarce (10.07.2026)","url":"https://developers.google.com/search/docs/fundamentals/ai-optimization-guide","short":"Google: przewodnik AI"},"g_features":{"who":"Google","label":"Google: funkcje AI a Twoja witryna (10.12.2025)","url":"https://developers.google.com/search/docs/appearance/ai-features","short":"Google: funkcje AI"},"g_snippet":{"who":"Google","label":"Google: fragmenty i meta description","url":"https://developers.google.com/search/docs/appearance/snippet","short":"Google: fragmenty"},"g_title":{"who":"Google","label":"Google: linki tytułowe","url":"https://developers.google.com/search/docs/appearance/title-link","short":"Google: tytuły"},"g_helpful":{"who":"Google","label":"Google: tworzenie pomocnych, wiarygodnych treści","url":"https://developers.google.com/search/docs/fundamentals/creating-helpful-content","short":"Google: pomocne treści"},"g_article":{"who":"Google","label":"Google: dane strukturalne Article (8.09.2026)","url":"https://developers.google.com/search/docs/data-types/article","short":"Google: Article"},"g_faq":{"who":"Google","label":"Google: koniec wyników rozszerzonych FAQ od 7.05.2026 (omówienie ppc.land)","url":"https://ppc.land/google-kills-faq-rich-results-what-seos-saw-coming-since-2019/","short":"Google: FAQ"},"cwv":{"who":"Google","label":"web.dev: Core Web Vitals","url":"https://web.dev/articles/vitals","short":"web.dev"},"openai":{"who":"Boty AI","label":"OpenAI: przegląd botów (OAI-SearchBot, GPTBot, ChatGPT-User)","url":"https://developers.openai.com/api/docs/bots.md","short":"OpenAI"},"anthropic":{"who":"Boty AI","label":"Anthropic: boty ClaudeBot, Claude-User, Claude-SearchBot","url":"https://support.claude.com/en/articles/8896518-does-anthropic-crawl-data-from-the-web-and-how-can-site-owners-block-the-crawler","short":"Anthropic"},"perplexity":{"who":"Boty AI","label":"Perplexity: boty PerplexityBot i Perplexity-User","url":"https://docs.perplexity.ai/docs/resources/perplexity-crawlers.md","short":"Perplexity"},"cloudflare":{"who":"Boty AI","label":"Cloudflare: zasady dostępu botów AI (Search, Agents, Training)","url":"https://developers.cloudflare.com/bots/additional-configurations/block-ai-bots/","short":"Cloudflare"},"ms_ads":{"who":"Microsoft","label":"Microsoft: optymalizacja treści pod odpowiedzi AI (10.2025)","url":"https://about.ads.microsoft.com/en/blog/post/october-2025/optimizing-your-content-for-inclusion-in-ai-search-answers","short":"Microsoft"},"bing_perf":{"who":"Microsoft","label":"Bing: raport AI Performance w Bing Webmaster Tools (02.2026)","url":"https://blogs.bing.com/webmaster/February-2026/Introducing-AI-Performance-in-Bing-Webmaster-Tools-Public-Preview","short":"Bing: raport AI"},"bing_guide":{"who":"Microsoft","label":"Bing: wytyczne dla webmasterów z częścią o GEO (omówienie Search Engine Journal, 02.2026)","url":"https://www.searchenginejournal.com/bing-adds-geo-to-official-guidelines-expands-ai-abuse-definitions/568442/","short":"Bing: wytyczne"},"geo":{"who":"Badanie","label":"Badanie GEO: Generative Engine Optimization (Aggarwal i in., KDD 2024)","url":"https://arxiv.org/html/2311.09735v3","short":"Badanie GEO"},"vercel":{"who":"Badanie","label":"Badanie Vercel i MERJ: boty AI a JavaScript (12.2024)","url":"https://vercel.com/blog/the-rise-of-the-ai-crawler","short":"Badanie Vercel"}},"groups":[{"id":"A","name":"Dostęp dla wyszukiwarek i botów AI","short":"Dostęp","lead":"Jeśli bot nie pobierze strony albo nie wolno mu pokazać fragmentu, reszta wskaźników nie ma znaczenia."},{"id":"B","name":"Zrozumiała struktura","short":"Struktura","lead":"Tytuł, nagłówki i dane strukturalne mówią, o czym jest strona i gdzie leży odpowiedź."},{"id":"C","name":"Wiarygodność i dowody","short":"Wiarygodność","lead":"Kto to napisał, kiedy i na jakiej podstawie."},{"id":"D","name":"Odpowiedź na pytania","short":"Odpowiedzi","lead":"Czy strona odpowiada na pytanie z frazy i na pytania poboczne, które AI zadaje przy okazji."},{"id":"E","name":"Szybkość i wygoda","short":"Szybkość","lead":"Strona ma działać szybko i poprawnie na telefonie."}],"rules":[{"code":"A1","group":"A","name":"Kod odpowiedzi","max":4,"partial":2,"required":true,"what":"Czy adres odpowiada poprawnie, bez łańcucha przekierowań.","how":"Pobieramy adres tak jak przeglądarka i liczymy przekierowania.","good":"Kod 200 po najwyżej 1 przekierowaniu.","mid":"Kod 200 po 2 lub więcej przekierowaniach.","bad":"Kod 4xx lub 5xx, pętla przekierowań albo brak odpowiedzi w 15 s.","fix":"Linkuj od razu do adresu docelowego i usuń pośrednie przekierowania.","basis":["g_features"]},{"code":"A2","group":"A","name":"Indeksowanie","max":6,"partial":3,"required":true,"what":"Czy strona może trafić do indeksu wyszukiwarki.","how":"Sprawdzamy znacznik meta robots, nagłówek X-Robots-Tag i adres kanoniczny.","good":"Brak noindex. Adres kanoniczny wskazuje tę samą stronę.","mid":"Brak noindex, ale brakuje adresu kanonicznego.","bad":"Jest noindex albo adres kanoniczny wskazuje inną stronę.","fix":"Usuń noindex i ustaw rel=canonical na własny adres strony.","basis":["g_features","g_guide"],"note":"Brak adresu kanonicznego nie blokuje indeksowania. Punktujemy go, bo wskazuje wyszukiwarce właściwy adres, gdy ta sama treść jest pod kilkoma adresami."},{"code":"A3","group":"A","name":"Fragment i cytat","max":4,"partial":2,"required":true,"what":"Czy wyszukiwarka może pokazać fragment strony. Bez tego strona nie będzie źródłem w odpowiedziach AI Google.","how":"Szukamy dyrektyw nosnippet, max-snippet i noarchive oraz atrybutu data-nosnippet.","good":"Brak nosnippet, max-snippet:0 i noarchive. Treść główna jest poza data-nosnippet.","mid":"max-snippet poniżej 160 znaków, data-nosnippet na części treści głównej albo noarchive.","bad":"nosnippet albo max-snippet:0.","fix":"Usuń ograniczenia fragmentu ze stron, które mają być cytowane. Atrybut data-nosnippet zostaw tylko na elementach, których nie chcesz pokazywać.","note":"Według wytycznych Bing dyrektywa noarchive wyłącza treść z odpowiedzi Copilota. Na Google nie wpływa, dlatego to stan „Do poprawy”, a nie „Źle”.","convention":"Próg 160 znaków jest umowny.","basis":["g_features","g_snippet","bing_guide"]},{"code":"A4","group":"A","name":"robots.txt dla botów wyszukiwania","max":8,"partial":4,"required":true,"what":"Czy boty, które budują wyniki wyszukiwania i odpowiedzi AI, mogą pobrać ten adres.","how":"Czytamy robots.txt i sprawdzamy reguły dla 5 botów: Googlebot, Bingbot, OAI-SearchBot (ChatGPT), PerplexityBot i Claude-SearchBot.","good":"Wszystkie 5 botów ma dostęp do adresu.","mid":"Googlebot i Bingbot mają dostęp, ale co najmniej 1 bot AI jest zablokowany.","bad":"Zablokowany Googlebot albo Bingbot.","fix":"Usuń regułę Disallow dla wymienionych botów. OpenAI i Perplexity podają, że zmiana działa po ok. 24 godzinach.","note":"Boty treningowe (GPTBot, ClaudeBot, Google-Extended) pokazujemy osobno i bez punktów. Ich blokada nie wpływa na wyszukiwanie. To decyzja właściciela strony.","basis":["openai","anthropic","perplexity","g_features"]},{"code":"A5","group":"A","name":"Serwer i CDN wpuszczają boty","max":4,"partial":2,"what":"Czy zapora, CDN lub hosting nie odrzucają botów mimo zgody w robots.txt.","how":"Wysyłamy 5 zapytań z nagłówkiem User-Agent każdego bota i porównujemy odpowiedź z odpowiedzią dla przeglądarki.","good":"5 z 5 zapytań zwraca kod 200 i tę samą treść co przeglądarce.","mid":"Kod 200 dla wszystkich, ale odpowiedź dla bota trwa ponad 5 s.","bad":"Co najmniej 1 bot dostaje kod 403, 429 albo stronę z testem zamiast treści.","fix":"W panelu CDN lub zapory zezwól na boty wyszukiwania AI. W Cloudflare: Security, Settings, AI Crawler and Agent access policies, kategoria Search na Allow.","note":"Test wychodzi z naszego serwera. Zapora, która weryfikuje adresy IP botów, może potraktować prawdziwego bota inaczej. Ostateczne potwierdzenie daje dziennik serwera.","convention":"Próg 5 s jest umowny.","basis":["g_features","perplexity","cloudflare"]},{"code":"A6","group":"A","name":"Treść bez JavaScript","max":4,"partial":2,"what":"Czy treść jest w kodzie HTML wysyłanym przez serwer. Według badania z 2024 r. boty OpenAI, Anthropic i Perplexity nie uruchamiają JavaScript.","how":"Porównujemy liczbę słów treści głównej w HTML z serwera i po uruchomieniu skryptów w przeglądarce.","good":"Co najmniej 90% słów treści głównej i nagłówek H1 są w HTML z serwera.","mid":"50-89% słów treści głównej.","bad":"Mniej niż 50% słów albo brak H1 w HTML z serwera.","fix":"Renderuj treść po stronie serwera. Skrypty zostaw do dodatków: opinii, czatu, liczników.","convention":"Progi 90% i 50% są umowne.","basis":["vercel","g_features","ms_ads"],"note":"Google uruchamia JavaScript, więc ten wskaźnik dotyczy pozostałych botów AI. Badanie jest z grudnia 2024 r. Jeśli boty zaczną uruchamiać skrypty, zmienimy wskaźnik w nowej wersji wytycznych."},{"code":"B1","group":"B","name":"Tytuł strony","max":4,"partial":2,"what":"Czy strona ma własny, opisowy tytuł.","how":"Odczytujemy znacznik title i porównujemy go z tytułami innych sprawdzonych stron witryny.","good":"Tytuł jest, opisuje treść i nie powtarza się na innych sprawdzonych stronach.","mid":"Tytuł powtarza się na innej stronie albo jest ogólnikiem (np. „Strona główna”).","bad":"Brak znacznika title albo jest pusty.","fix":"Napisz własny, opisowy tytuł dla każdej strony. Nazwę marki dodaj krótko na końcu.","note":"Google nie podaje limitu długości tytułu. Tytuł ponad ok. 60 znaków może zostać ucięty w wynikach, więc pokazujemy to jako wskazówkę bez punktów.","basis":["g_title","ms_ads"]},{"code":"B2","group":"B","name":"Opis strony","max":3,"partial":1,"what":"Meta description: krótki opis, którego wyszukiwarka może użyć jako fragmentu.","how":"Odczytujemy meta description i porównujemy z opisami innych sprawdzonych stron.","good":"Opis jest i nie powtarza się na innych sprawdzonych stronach.","mid":"Opis jest, ale taki sam jak na innej stronie.","bad":"Brak opisu.","fix":"Opisz w 1-2 zdaniach, co czytelnik znajdzie na stronie. Bez listy słów kluczowych.","note":"Google nie podaje limitu długości opisu.","basis":["g_snippet","ms_ads"]},{"code":"B3","group":"B","name":"Nagłówek H1","max":4,"partial":2,"what":"Czy strona ma jeden główny nagłówek zgodny z tytułem.","how":"Liczymy nagłówki H1 i porównujemy słowa H1 ze słowami tytułu (bez spójników i nazwy marki).","good":"Dokładnie jeden H1, a co najmniej połowa jego słów jest też w tytule.","mid":"Kilka H1 albo mniej niż połowa wspólnych słów z tytułem.","bad":"Brak H1 albo H1 jest pusty.","fix":"Zostaw jeden H1, który mówi to samo co tytuł strony.","convention":"Próg połowy wspólnych słów jest umowny.","basis":["g_title","ms_ads"]},{"code":"B4","group":"B","name":"Nagłówki sekcji","max":4,"partial":2,"what":"Czy treść jest podzielona na sekcje z konkretnymi nagłówkami.","how":"Sprawdzamy trzy warunki: co najmniej 2 nagłówki H2 na stronie powyżej 300 słów, poziomy po kolei (bez przeskoku z H2 do H4), brak ogólników z listy (np. „Informacje”, „Dowiedz się więcej”).","good":"Spełnione 3 z 3 warunków.","mid":"Spełnione 2 z 3 warunków.","bad":"Spełniony 1 warunek albo żaden.","fix":"Podziel treść na sekcje. Nagłówek ma mówić, o czym jest sekcja, najlepiej jako pytanie albo konkretny temat.","convention":"Próg 300 słów i lista ogólników są umowne.","basis":["g_guide","ms_ads","bing_perf"]},{"code":"B5","group":"B","name":"Bez ścian tekstu","max":3,"partial":1,"what":"Czy akapity są na tyle krótkie, że widać granice między myślami.","how":"Liczymy słowa w każdym akapicie treści głównej.","good":"Żaden akapit nie ma więcej niż 150 słów.","mid":"1-2 akapity powyżej 150 słów.","bad":"3 lub więcej akapitów powyżej 150 słów.","fix":"Podziel długie akapity. Kroki i porównania zapisz jako listę albo tabelę.","convention":"Próg 150 słów jest umowny.","basis":["ms_ads","g_guide"]},{"code":"B6","group":"B","name":"Treść jako tekst","max":3,"partial":1,"what":"Czy ważne informacje są tekstem, a nie tylko obrazem albo plikiem PDF.","how":"Liczymy zdjęcia w treści głównej z opisem alt. Sprawdzamy, czy cena, parametry i kroki są w HTML.","good":"Co najmniej 90% zdjęć w treści ma opis alt, a kluczowe dane są tekstem.","mid":"50-89% zdjęć ma opis alt.","bad":"Mniej niż 50% zdjęć ma opis alt albo kluczowe dane są tylko na obrazie lub w PDF.","fix":"Dodaj opisy alt. Parametry, ceny i kroki zapisz w HTML.","convention":"Progi 90% i 50% są umowne.","basis":["g_features","ms_ads"]},{"code":"B7","group":"B","name":"Dane strukturalne","max":4,"partial":2,"what":"Czy dane strukturalne są poprawne i zgodne z tym, co widać na stronie.","how":"Odczytujemy JSON-LD, sprawdzamy składnię i typ, porównujemy wartości (tytuł, autor, data, cena) z widoczną treścią.","good":"JSON-LD bez błędów, typ pasuje do strony (artykuł: Article lub BlogPosting, produkt: Product, strona główna: Organization i WebSite), wartości zgodne z treścią.","mid":"Brak danych strukturalnych albo dane niepełne.","bad":"Błąd składni albo wartości sprzeczne z widoczną treścią.","fix":"Dodaj JSON-LD właściwy dla rodzaju strony i trzymaj go w zgodzie z treścią.","note":"Google nie wymaga danych strukturalnych do odpowiedzi AI. Punktujemy je, bo dają wyniki rozszerzone i zaleca je Microsoft. Typ FAQPage jest bez punktów: od 7.05.2026 nie daje wyników rozszerzonych w Google.","basis":["g_features","g_guide","ms_ads","g_faq"]},{"code":"C1","group":"C","name":"Autor","max":5,"partial":2,"what":"Czy wiadomo, kto napisał treść.","how":"Szukamy podpisu autora, linku do strony o autorze lub „O nas” i właściwości author w danych strukturalnych.","good":"Widoczne imię i nazwisko autora, link do strony o autorze, autor w danych strukturalnych (Person z name i url).","mid":"Podpis jest, ale brakuje linku albo danych strukturalnych.","bad":"Brak informacji o autorze.","fix":"Podpisz treść prawdziwym autorem i podlinkuj jego stronę z opisem doświadczenia.","note":"Na stronach produktów i ofert zamiast autora sprawdzamy wydawcę (Organization). Zmyślony autor to oszustwo według Google.","basis":["g_helpful","g_article"]},{"code":"C2","group":"C","name":"Daty","max":4,"partial":2,"what":"Czy widać, kiedy treść powstała i kiedy była aktualizowana.","how":"Szukamy widocznej daty i porównujemy ją z datePublished i dateModified w danych strukturalnych (format ISO 8601).","good":"Widoczna data publikacji lub aktualizacji i ta sama data w danych strukturalnych.","mid":"Data jest widoczna, ale brakuje jej w danych strukturalnych albo różni się o ponad 1 dzień.","bad":"Brak daty. Także wtedy, gdy data zmieniła się między audytami, a treść nie.","fix":"Pokaż datę aktualizacji i zmieniaj ją tylko razem z treścią.","note":"Google ostrzega przed zmianą daty bez zmiany treści. Wskaźnik dotyczy artykułów i poradników. Na stronie głównej, stronie produktu i stronie oferty data nie jest oczekiwana, więc raport pokazuje „nie dotyczy” i nie liczy tych punktów.","basis":["g_article","g_helpful","bing_perf"],"applies":["article"]},{"code":"C3","group":"C","name":"Źródła","max":4,"partial":2,"what":"Czy twierdzenia i liczby mają podane źródło.","how":"Liczymy linki z treści głównej do zewnętrznych źródeł. Nie liczymy linków do własnej witryny, sklepów i mediów społecznościowych.","good":"Co najmniej 2 źródła na 1000 słów treści, minimum 2.","mid":"1 źródło.","bad":"Brak źródeł.","fix":"Podlinkuj dane, normy i badania, na które się powołujesz.","note":"W badaniu GEO dodanie źródeł podniosło widoczność w odpowiedzi AI o 28%. Test był na symulowanym silniku, nie na ChatGPT ani Google. Wskaźnik dotyczy artykułów i poradników. Na pozostałych rodzajach stron raport pokazuje „nie dotyczy” i nie liczy tych punktów.","convention":"Próg 2 źródeł na 1000 słów jest umowny.","basis":["geo","g_helpful","bing_perf"],"applies":["article"]},{"code":"C4","group":"C","name":"Konkretne dane","max":3,"partial":1,"what":"Czy /* Mockup liczy wszystko względem jednej daty, żeby terminy i dni po terminie nie zmieniały się z dnia na dzień. */
const TODAY = new Date(PLAT.today + 'T12:00:00');
const num = (n, d = 0) => { const [a, b] = Math.abs(n).toFixed(d).split('.'); return (n < 0 ? '-' : '') + a.replace(/\B(?=(\d{3})+$)/g, '\u00a0') + (b ? ',' + b : ''); };
const zl = (n, d = 0) => num(n, d) + '\u00a0zł';
const dpl = (iso) => { const [d, t] = iso.split('T'), [y, m, dd] = d.split('-'); return `${dd}.${m}.${y}` + (t && t !== '23:59' ? ', ' + t : ''); };
const daysTo = (iso) => Math.round((new Date(iso.slice(0, 10) + 'T12:00:00') - TODAY) / 86400000);
const dni = (n) => n + (n === 1 ? ' dzień' : ' dni');
const put = (id, html) => { document.getElementById('v-' + id).innerHTML = html; };
const MODS = [], ACTIONS = {}, CHANGES = {}, FORMS = {};

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LABEL = { good: 'Dobrze', mid: 'Do poprawy', bad: 'Źle' };
const st = (s, label) => `<span class="state ${s}">${esc(label || LABEL[s])}</span>`;
/* Pierwsza litera mała, ale skrótów (LCP, JSON-LD, HTTPS) nie ruszamy. */
const lcfirst = (t) => /^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż ]/.test(t) ? t.charAt(0).toLowerCase() + t.slice(1) : t;
const REQUIRED = RULES.rules.filter((r) => r.required);
const state = { audit: 'a' };

/* Punkty liczymy z wytycznych, nigdy nie wpisujemy sum ręcznie. */
function result(rule, audit) {
  const r = SAMPLE.results[rule.code][audit];
  let status = r[0], pts;
  if (status === 'parts') {
    pts = r[3].reduce((a, b) => a + b, 0);
    status = pts === rule.max ? 'good' : (pts * 2 >= rule.max ? 'mid' : 'bad');
  } else {
    pts = status === 'good' ? rule.max : (status === 'mid' ? rule.partial : 0);
  }
  return { status, pts, value: r[1], evidence: r[2] || '' };
}
function totals(audit) {
  const g = {}; let sum = 0; const blocked = [];
  for (const gr of RULES.groups) g[gr.id] = { pts: 0, max: 0 };
  for (const rule of RULES.rules) {
    const res = result(rule, audit);
    g[rule.group].pts += res.pts; g[rule.group].max += rule.max; sum += res.pts;
    if (rule.required && res.status === 'bad') blocked.push(rule);
  }
  return { sum, g, blocked };
}
const level = (score) => score >= RULES.levels.good ? 'good' : (score >= RULES.levels.mid ? 'mid' : 'bad');
const auditOf = (id) => SAMPLE.audits.find((a) => a.id === id);
const srcLinks = (keys) => keys.map((k) => { const s = RULES.sources[k]; return `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.label)}">${esc(s.short)}</a>`; }).join(', ');
const auditSwitch = () => `<div class="switch" role="group" aria-label="Wybierz audyt">` + SAMPLE.audits.map((a) =>
  `<button type="button" data-audit="${a.id}" aria-pressed="${state.audit === a.id}"><span>${esc(a.date)},</span> <span>${esc(a.label)}</span></button>`).join('') + `</div>`;

/* Linijka 100 punktów: każdy wskaźnik to odcinek o szerokości równej jego punktom, wypełniony w takiej części, w jakiej jest zaliczony. */
function ruler(audit, interactive) {
  return `<div class="ruler" role="group" aria-label="100 punktów w podziale na wskaźniki">` + RULES.groups.map((gr) => {
    const rules = RULES.rules.filter((r) => r.group === gr.id), max = rules.reduce((a, r) => a + r.max, 0);
    let pts = 0;
    const segs = rules.map((r) => {
      const x = result(r, audit); pts += x.pts;
      const label = `${r.code} ${r.name}: ${x.pts} z ${r.max} pkt, ${LABEL[x.status]}`;
      const fill = `<i style="width:${Math.round(100 * x.pts / r.max)}%"></i>`;
      return interactive
        ? `<button type="button" class="seg ${x.status}" style="flex:${r.max}" data-rule="${r.code}" aria-label="${esc(label)}" title="${esc(label)}">${fill}</button>`
        : `<span class="seg ${x.status}" style="flex:${r.max}" title="${esc(label)}">${fill}</span>`;
    }).join('');
    return `<div class="rg" style="flex:${max} 1 ${max * 5}px"><div class="segs">${segs}</div><div class="rg-l"><span><b>${gr.id}</b>${esc(gr.short)}</span><span class="num">${pts} / ${max}</span></div></div>`;
  }).join('') + `</div>`;
}

  if (todo.length) {

    if (todo.length > 6) h += `<p class="small muted" style="padding-top:12px">Pozostałe zadania (${todo.length - 6}) są niżej przy wskaźnikach.</p>`;

/* Ocenę zapytania liczy program z tabeli zasad. AI jej nie zmienia. */
function leadScore(answers, phone) {
  let pts = 0;
  const rows = LEADS.questions.map((q, i) => {
    if (answers[i] === undefined) return { label: q.label, answer: null, pts: 0, max: maxOf(q) };
    const o = q.options[answers[i]]; pts += o[1];
    return { label: q.label, answer: o[0], pts: o[1], max: maxOf(q) };
  });
  const ph = phone ? LEADS.phone_points : 0; pts += ph;
  rows.push({ label: 'Telefon', answer: phone === null ? null : (phone ? 'Podany' : 'Nie podano'), pts: ph, max: LEADS.phone_points });
  return { pts, rows };
}
const leadLevel = (p) => p >= LEADS.levels.hot ? ['hot', 'Pilne'] : (p >= LEADS.levels.talk ? ['talk', 'Do rozmowy'] : ['plain', 'Niski priorytet']);

}

function ztest(n1, x1, n2, x2) {
  const p1 = x1 / n1, p2 = x2 / n2, p = (x1 + x2) / (n1 + n2);
  return { p1, p2, z: (p2 - p1) / Math.sqrt(p * (1 - p) * (1 / n1 + 1 / n2)) };
}
function renderResults() {
  const f = LEADS.funnel, ab = LEADS.ab, t = ztest(ab.a[1], ab.a[2], ab.b[1], ab.b[2]);

      f.map((s, i) => `<div class="meter"><span>${esc(s[0])}${i ? ` <span class="small muted">${pct(s[1], f[i - 1][1])}</span>` : ''}</span><span class="num">${s[1]}</span>
        <div class="hbar${i === f.length - 1 ? ' key' : ''}"><i style="width:${Math.max(1, Math.round(100 * s[1] / f[0][1]))}%"></i></div></div>`).join('') + `</div>

      <div class="table-wrap"><table><thead><tr><th>Wariant</th><th class="n">Odsłony</th><th class="n">Zapytania</th><th class="n">Konwersja</th></tr></thead><tbody>${row(ab.a)}${row(ab.b)}</tbody></table></div>
      <p>${sure ? st('good', 'Różnica pewna') : st('mid', 'Za mało danych')}</p>
      <p>Wynik testu: z = ${zs}, próg pewności to 1,96. ${sure ? 'Można wybrać lepszy wariant.' : 'Kwalifikator ma na razie wyższą konwersję, ale taka różnica mogła wyjść przypadkiem. Test trwa dalej.'}</p></div>
    </div>
    <div class="sec"><div class="sec-h"><h2>Jak to liczymy</h2></div><ul class="list" style="padding-top:16px">

      <li>Wariant przydziela serwer, bez plików cookie.</li></ul></div>`;
}

/* ===== Wykres liniowy =====
   Jedna oś, linie 2 px, kropka na końcu z obwódką w kolorze tła, wartość przy końcu linii.
   Po najechaniu albo po strzałkach z klawiatury: pionowa linia i dymek ze wszystkimi seriami.
   Wykres rysujemy dopiero w widocznym widoku, w jego rzeczywistej szerokości, żeby tekst nie malał na telefonie. */
const CHARTS = {};
function chart(id, def) { CHARTS[id] = def; return `<div class="chart" data-chart="${id}"></div>`; }
function niceMax(v) {
  const p = Math.pow(10, Math.floor(Math.log10(v / 4)));
  for (const k of [1, 2, 2.5, 5, 10]) if (k * p * 4 >= v) return k * p * 4;
  return 40 * p;
}
const keys = (series) => `<div class="keys">${series.map((s) => `<span class="key"><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
const dataTable = (def, first) => `<details class="more"><summary>Pokaż dane w tabeli</summary><div class="table-wrap"><table><thead><tr><th>${esc(first)}</th>${def.series.map((s) => `<th class="n">${esc(s.name)}</th>`).join('')}</tr></thead><tbody>` +
  def.labels.map((l, i) => `<tr><td>${esc(l)}</td>${def.series.map((s) => `<td class="n">${esc((def.tipFmt || num)(s.values[i]))}</td>`).join('')}</tr>`).join('') + `</tbody></table></div></details>`;

function drawCharts() {
  for (const el of document.querySelectorAll('.chart[data-chart]')) {
    const W = Math.floor(el.clientWidth), def = CHARTS[el.dataset.chart];
    if (!W || !def) continue;
    const H = 230, L = 46, R = 64, T = 12, B = 28, n = def.labels.length;
    const max = niceMax(Math.max(...def.series.flatMap((s) => s.values)));
    const x = (i) => L + (W - L - R) * i / (n - 1), y = (v) => T + (H - T - B) * (1 - v / max);
    const fmt = def.fmt || ((v) => num(v));
    let g = '';
    for (let k = 0; k <= 4; k++) {
      const v = max * k / 4;
      g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--grid)" stroke-width="1"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${esc(fmt(v))}</text>`;
    }
    const step = W < 480 ? 2 : 1;
    def.labels.forEach((l, i) => { if ((n - 1 - i) % step === 0) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`; });
    const ends = def.series.map((s) => y(s.values[n - 1]));
    const labelEnds = def.series.length === 1 || Math.abs(ends[0] - ends[1]) >= 16;
    def.series.forEach((s, k) => {
      g += `<polyline fill="none" style="stroke:${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${s.values.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ')}"/>`;
      g += `<circle cx="${x(n - 1)}" cy="${ends[k]}" r="4.5" style="fill:${s.color};stroke:var(--ink)" stroke-width="2"/>`;
      if (labelEnds) g += `<text class="val" x="${x(n - 1) + 10}" y="${ends[k] + 4}">${esc((def.endFmt || fmt)(s.values[n - 1]))}</text>`;
    });
    g += `<g class="hover" visibility="hidden"><line y1="${T}" y2="${H - B}" style="stroke:var(--muted)" stroke-width="1"/>${def.series.map((s) => `<circle r="4.5" style="fill:${s.color};stroke:var(--ink)" stroke-width="2"/>`).join('')}</g>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" tabindex="0" aria-label="${esc(def.title)}. Strzałki w lewo i w prawo pokazują kolejne wartości.">${g}</svg>`;
    el._geo = { W, L, R, n, x, y };
    el._i = undefined;
  }
}
function chartAt(el, i) {
  const def = CHARTS[el.dataset.chart], geo = el._geo, svg = el.querySelector('svg'), hov = svg.querySelector('.hover'), line = hov.querySelector('line');
  hov.setAttribute('visibility', 'visible');
  line.setAttribute('x1', geo.x(i)); line.setAttribute('x2', geo.x(i));
  hov.querySelectorAll('circle').forEach((c, k) => { c.setAttribute('cx', geo.x(i)); c.setAttribute('cy', geo.y(def.series[k].values[i])); });
  const tip = document.getElementById('tip');
  tip.textContent = '';
  const head = document.createElement('b');
  head.textContent = (def.prefix || '') + def.labels[i];
  tip.appendChild(head);
  for (const s of def.series) {
    const row = document.createElement('div'), key = document.createElement('i'), v = document.createElement('strong'), name = document.createElement('span');
    key.style.background = s.color; v.textContent = (def.tipFmt || num)(s.values[i]); name.textContent = s.name;
    row.append(key, v, name); tip.appendChild(row);
  }
  tip.hidden = false;
  const r = svg.getBoundingClientRect(), px = r.left + geo.x(i), tw = tip.offsetWidth;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - tw - 8, px + 14 + tw > window.innerWidth ? px - tw - 14 : px + 14)) + 'px';
  tip.style.top = Math.max(8, r.top + 6) + 'px';
  el._i = i;
}
function hideTip() {
  const tip = document.getElementById('tip');
  if (tip) tip.hidden = true;
  for (const h of document.querySelectorAll('.chart .hover')) h.setAttribute('visibility', 'hidden');
}
const chartOf = (e) => { const el = e.target.closest ? e.target.closest('.chart') : null; return el && el._geo ? el : null; };
document.addEventListener('pointermove', (e) => {
  const el = chartOf(e);
  if (!el) return;
  const r = el.querySelector('svg').getBoundingClientRect(), g = el._geo;
  chartAt(el, Math.max(0, Math.min(g.n - 1, Math.round((e.clientX - r.left - g.L) / ((g.W - g.L - g.R) / (g.n - 1))))));
});
document.addEventListener('pointerout', (e) => { const el = chartOf(e); if (el && !el.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', (e) => { const el = chartOf(e); if (el) chartAt(el, el._i === undefined ? el._geo.n - 1 : el._i); });
document.addEventListener('focusout', (e) => { if (chartOf(e)) hideTip(); });
document.addEventListener('keydown', (e) => {
  const el = chartOf(e);
  if (!el || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
  e.preventDefault();
  const i = el._i === undefined ? el._geo.n - 1 : el._i;
  chartAt(el, Math.max(0, Math.min(el._geo.n - 1, i + (e.key === 'ArrowLeft' ? -1 : 1))));
});

  for (const { t, m } of matchAll().ok) {

  const order = { bad: 0, mid: 1, plain: 2 };
  return items.sort((a, b) => order[a[0]] - order[b[0]]);

state.k = { contact: 4, kind: 'cold_offer', ack: false, saved: false, f: { pkd: '', region: '', tenders: '' }, open: '' };
const RISK = { low: ['good', 'niskie'], high: ['mid', 'wysokie'], very_high: ['bad', 'bardzo wysokie'] };
const contactOf = (id) => PLAT.contacts.find((c) => c.id === id);
const basisLine = (c) => PLAT.bases[c.basis] + (c.detail ? ': ' + c.detail : '') + (c.at ? ' (' + c.at + ')' : '');

const INVITE_LEAD = 'Firma sama opublikowała adres do przesyłania ofert. Udostępnienie adresu w tym celu jest formą zgody.';
const INVITE_NOTES = ['Zgoda obejmuje oferty, o jakie firma prosi. Jeśli zaprasza dostawców materiałów, oferta innej usługi się w tym nie mieści.', 'Pisz tylko na adres podany w zaproszeniu i zachowaj link oraz cytat jako dowód.'];

/* Ocena ryzyka prawnego wiadomości. Te same reguły co w silniku (RiskPolicy): platforma pokazuje ryzyko,
   decyzję podejmuje użytkownik, a jedyna twarda blokada to sprzeciw odbiorcy. */
function assessMessage(kind, c) {
  const has = (...b) => b.includes(c.basis), pke = PLAT.law.pke, basis = ['Podstawa kontaktu: ' + basisLine(c)];
  if (c.unsub && kind !== 'rfq_reply') {
    return { level: 'very_high', blocked: true, ack: true, lead: 'Odbiorca wypisał się z wiadomości. Nie możesz wysyłać mu ofert ani próśb o zgodę.', reasons: ['Sprzeciw zapisano ' + c.unsub + '.'], law: [PLAT.law.unsub] };
  }
  let level, lead, reasons = [], law = [];
  if (kind === 'rfq_reply') {
    if (has('rfq')) { level = 'low'; lead = 'Firma sama poprosiła o oferty. Odpowiedź na zapytanie nie wymaga osobnej zgody marketingowej.'; reasons = basis; }
    else { level = 'high'; lead = 'W karcie kontaktu nie ma zapisanego zapytania ofertowego od tej firmy. Bez niego wiadomość może zostać uznana za niezamówioną informację handlową.'; reasons = ['Dopisz w karcie kontaktu, gdzie i kiedy firma prosiła o oferty, np. link do zapytania.']; law = pke; }
  } else if (kind === 'consented') {
    if (has('invite')) { level = 'low'; lead = INVITE_LEAD; reasons = basis.concat(INVITE_NOTES); law = [PLAT.law.invite]; }
    else if (has('consent', 'client')) { level = 'low'; lead = 'Odbiorca wyraził zgodę albo jest Twoim klientem. Pamiętaj o łatwym sposobie wypisania się w stopce.'; reasons = basis; }
    else { level = 'very_high'; lead = 'W karcie kontaktu nie ma zapisanej zgody. Wysłanie oferty bez zgody narusza przepisy o informacji handlowej.'; reasons = ['Zapisz w karcie kontaktu, kiedy i w jaki sposób odbiorca wyraził zgodę.']; law = pke; }
  } else if (kind === 'consent_request') {
    level = has('consent', 'client', 'rfq', 'invite') ? 'low' : 'very_high';
    lead = level === 'low' ? 'Masz już podstawę kontaktu. Zamiast prosić o zgodę możesz od razu odpowiedzieć albo wysłać ofertę.'
      : 'Prośba o zgodę wysłana e-mailem też jest kontaktem bez zgody. Ministerstwo Cyfryzacji uznaje taki kontakt za niedozwolony.';
    if (level !== 'low') { law = pke.concat(PLAT.law.consent_request); reasons = ['Bez zgody możesz wysłać list pocztą albo odpowiedzieć na zapytanie ofertowe firmy. Te drogi nie wymagają zgody na kontakt elektroniczny.',
      'Zgodę zbierzesz bez ryzyka listem: panel drukuje w nim adres strony zgody, na której firma sama wpisuje e-mail i zaznacza zgodę. Znajdziesz to w zakładce „Potencjalni klienci”.']; }
  } else if (has('invite')) {
    level = 'low'; lead = INVITE_LEAD; reasons = basis.concat(INVITE_NOTES); law = [PLAT.law.invite];
  } else if (has('consent', 'client')) {
    level = 'low'; lead = 'Masz zapisaną zgodę lub relację z klientem, więc to w praktyce oferta za zgodą.'; reasons = basis;
  } else {
    level = 'very_high'; lead = 'Informacja handlowa bez wcześniejszej zgody odbiorcy jest zakazana, także wobec firm.'; law = pke;
    reasons = ['Odbiorca może złożyć skargę do Prezesa UKE albo pozew z tytułu nieuczciwej konkurencji.'];
  }
  return { level, blocked: false, ack: level !== 'low', lead, reasons, law };
}

/* Szkic regułowy, bez AI. Szablony jak w silniku. */
function draftMessage(kind, c) {
  const greet = c.person ? 'Dzień dobry, ' + c.person + ',' : 'Dzień dobry,';
  const sig = PLAT.org.user + '\n' + PLAT.org.name + '\n' + PLAT.org.site;
  const optOut = '\n\nJeśli nie chcą Państwo otrzymywać od nas wiadomości, wystarczy odpisać „rezygnuję”.';
  const about = '[Krótki opis oferty dopasowany do firmy odbiorcy]';
  if (kind === 'rfq_reply') return ['Odpowiedź na zapytanie ofertowe', `${greet}\n\ndziękujemy za zapytanie ofertowe. W załączeniu przesyłamy ofertę.\n\nCena: [CENA] zł netto\nTermin realizacji: [TERMIN]\nWarunki płatności: [WARUNKI]\n\nChętnie odpowiemy na pytania i doprecyzujemy zakres.\n\nZ poważaniem\n${sig}`];
  if (kind === 'consented') return ['Oferta ' + PLAT.org.name, `${greet}\n\nzgodnie z Państwa zgodą przesyłamy informację o naszej ofercie.\n\n${about}\n\nCzy możemy umówić krótką rozmowę w przyszłym tygodniu?\n\nZ poważaniem\n${sig}${optOut}`];
  if (kind === 'consent_request') return ['Czy możemy przesłać ofertę?', `${greet}\n\nczy wyrażają Państwo zgodę na przesłanie na ten adres e-mail jednej wiadomości z ofertą firmy ${PLAT.org.name}?\n\nWystarczy odpowiedzieć „tak”. Jeśli nie odpowiedzą Państwo, nie będziemy pisać ponownie.\n\nZ poważaniem\n${sig}`];
  return ['Propozycja współpracy: ' + PLAT.org.name, `${greet}\n\n${about}\n\nCzy możemy przesłać szczegóły?\n\nZ poważaniem\n${sig}${optOut}`];
}

/* Drogi kontaktu z firmą z listy, od najmniej ryzykownej. Lista i treść oferty nie wymagają zgody, zgody wymaga wysyłka e-mailem. */
function prospectPaths(x) {
  const known = PLAT.contacts.find((c) => c.company === x.company);
  if (known && known.unsub) return [['bad', 'zablokowane', 'Firma zgłosiła sprzeciw', 'Wypisała się ' + known.unsub + '. Panel nie przygotuje dla niej listu ani oferty.', '']];
  const out = [];
  if (x.consent) out.push(['good', 'niskie ryzyko', 'Oferta e-mailem: masz zgodę', 'Firma sama wpisała adres ' + x.consent[0] + ' na stronie zgody z listu i zaznaczyła zgodę (' + x.consent[1] + '). Panel przechowuje dowód: treść zgody, czas i źródło.', 'consent']);
  if (x.invite) out.push(['good', 'niskie ryzyko', 'Oferta na adres, który firma podała do ofert', '„' + x.invite[0] + '” (' + x.invite[2] + '). Udostępnienie adresu w tym celu jest formą zgody. Zgoda obejmuje oferty, o jakie firma prosi.', 'invite']);
  out.push(['good', 'niskie ryzyko', x.consent ? 'List pocztą' : 'List pocztą z prośbą o zgodę na e-mail', 'Wymóg zgody dotyczy telefonu i środków elektronicznych. List papierowy pod niego nie podlega. Panel przygotowuje plik .docx z tą treścią.'
    + (x.consent ? '' : ' W liście jest adres strony zgody i kod QR. Firma sama wpisuje tam e-mail i zaznacza zgodę, a od tej chwili oferta e-mailem ma podstawę.'), 'letter']);
  if (!x.invite && !x.consent) out.push(['bad', 'bardzo wysokie ryzyko', 'E-mail bez zgody', 'Informacja handlowa bez wcześniejszej zgody jest zakazana, także wobec firm. Prośba o zgodę wysłana e-mailem też. Panel przygotuje wiadomość i pokaże ekran ryzyka, a decyzję podejmujesz Ty.', 'email']);
  return out;
}

      <label class="field" for="cpMail-${i}" style="padding-top:12px">Adres e-mail, na który wysłać ofertę<input id="cpMail-${i}" type="email" maxlength="120" autocomplete="off"></label>

const prospectPitch = (x) => (x.win ? 'Piszemy, ponieważ Państwa firma zawarła niedawno umowę na zamówienie „' + x.win + '”.' : 'Zajrzeliśmy na Państwa stronę i zauważyliśmy rzecz do poprawy: ' + x.reason.charAt(0).toLowerCase() + x.reason.slice(1));

  put('firmy', stan('silnik', 'Lista z wyników przetargów i z Twojej listy, dane z rejestrów, treść oferty i drogi kontaktu z oceną ryzyka. Wyszukiwanie w rejestrach REGON i CEIDG wymaga kluczy.') +
    `<div class="sec">${secHead('Idealny klient', 'Opis powstaje z treści Twojej strony. Zatwierdzasz go albo poprawiasz. AI korzysta z niego, gdy pisze treść oferty.')}

}

/* ===== Reklamy: Google Ads i Meta Ads ===== */
state.ads = { metric: 'cpa', confirm: null, error: '' };
const sum = (a) => a.reduce((x, y) => x + y, 0);
const METRICS = { cpa: ['Koszt konwersji', (v) => zl(v, 2)], spend: ['Wydatki', (v) => zl(v)], conv: ['Konwersje', (v) => num(v)], clicks: ['Kliknięcia', (v) => num(v)] };
const AD_COLOR = { google: 'var(--s1)', meta: 'var(--s2)' };
const change = (cur, prev) => 100 * (cur - prev) / prev;
/* Dwa okresy po 4 tygodnie: bieżący i poprzedni. Koszt konwersji to wydatki podzielone przez konwersje. */
function period(rows) {
  const mk = (from) => { const part = (k) => sum(rows.map((p) => sum(p[k].slice(from, from + 4)))), spend = part('spend'), conv = part('conv'); return { spend, clicks: part('clicks'), conv, cpa: spend / conv }; };
  return { cur: mk(4), prev: mk(0) };
}
/* Wzrost kosztu jest zły, wzrost konwersji dobry. Wydatki i kliknięcia pokazujemy bez oceny. */
function delta(k, cur, prev) {
  const ch = change(cur, prev), cls = k === 'cpa' ? (ch > 0 ? ' delta neg' : ' delta') : (k === 'conv' ? (ch < 0 ? ' delta neg' : ' delta') : ' muted');
  return `<span class="small${cls}">${proc(ch, true)}</span>`;
}
const campaignOf = (id) => PLAT.ads.campaigns.find((c) => c.id === id);
const platformName = (id) => PLAT.ads.platforms.find((p) => p.id === id).name;

/* Alerty liczone z danych: budżet wykorzystany w co najmniej 90%, koszt konwersji wyższy o co najmniej 30%, kampania wstrzymana. */
function adsAlerts() {
  const out = [], left = new Date(TODAY.getFullYear(), TODAY.getMonth() + 1, 0).getDate() - TODAY.getDate();
  for (const p of PLAT.ads.platforms) {
    const used = p.month_spend / p.month_budget;
    if (used >= 0.9) out.push(['bad', `Budżet miesięczny ${p.name} wykorzystany w ${Math.round(100 * used)}%`, `Wydano ${zl(p.month_spend)} z ${zl(p.month_budget)}, do końca miesiąca ${dni(left)}.`]);
  }
  for (const c of PLAT.ads.campaigns) {
    const cur = c.spend / c.conv, prev = c.prev_spend / c.prev_conv, ch = change(cur, prev);
    if (c.active && ch >= 30) out.push(['mid', `Koszt konwersji w kampanii „${c.name}” wzrósł o ${num(ch)}%`, `${zl(cur, 2)} wobec ${zl(prev, 2)} w poprzednich 4 tygodniach.`]);
    if (!c.active) out.push(['plain', `Kampania „${c.name}” jest wstrzymana`, 'Wstrzymano ' + (c.paused || 'przed chwilą') + '.']);
  }
  return out;
}
const ALERT = { bad: 'pilne', mid: 'do sprawdzenia', plain: 'informacja' };
const adsNote = () => stan('zgoda', 'Dane są przykładowe. Podłączenie kont wymaga zatwierdzenia platformy przez Google i Meta.');

function renderAds() {
  const A = PLAT.ads, m = state.ads.metric, rows = A.platforms.map((p) => [p.name, period([p]), p.id]).concat([['Razem', period(A.platforms), null]]);
  const cell = (k, r) => `<td class="n">${METRICS[k][1](r.cur[k])}<br>${delta(k, r.cur[k], r.prev[k])}</td>`;
  const def = { title: METRICS[m][0] + ' tygodniami, Google Ads i Meta Ads', labels: A.weeks, prefix: 'Tydzień od ', tipFmt: METRICS[m][1], endFmt: (v) => num(v, m === 'cpa' ? 2 : 0),
    series: A.platforms.map((p) => ({ name: p.name, color: AD_COLOR[p.id], values: p.spend.map((s, i) => m === 'cpa' ? s / p.conv[i] : p[m][i]) })) };
  put('reklamy', adsNote() +
    `<div class="sec">${secHead('Ostatnie 4 tygodnie', 'Pod każdą liczbą zmiana wobec poprzednich 4 tygodni.')}
      <div class="table-wrap"><table style="min-width:620px"><thead><tr><th>Konto</th><th class="n">Wydatki</th><th class="n">Kliknięcia</th><th class="n">Konwersje</th><th class="n">Koszt konwersji</th></tr></thead><tbody>` +
      rows.map(([name, r, id]) => `<tr><td>${id ? `<span class="key"><i style="background:${AD_COLOR[id]}"></i><b>${esc(name)}</b></span>` : `<b>${esc(name)}</b>`}</td>${['spend', 'clicks', 'conv', 'cpa'].map((k) => cell(k, r)).join('')}</tr>`).join('') + `</tbody></table></div></div>
    <div class="sec">${secHead('Przebieg tygodniami')}
      <div class="bar-row" style="padding:16px 0 12px"><div class="switch wide" role="group" aria-label="Wybierz miarę">${Object.entries(METRICS).map(([k, v]) => `<button type="button" data-act="ad-metric" data-m="${k}" aria-pressed="${k === m}">${v[0]}</button>`).join('')}</div>${keys(def.series)}</div>
      <p class="small muted" style="padding-bottom:6px">${esc(METRICS[m][0])}${m === 'cpa' || m === 'spend' ? ', zł' : ''}</p>${chart('ads', def)}${dataTable(def, 'Tydzień od')}</div>
    <p class="note">Alerty z tych danych: ${adsAlerts().length}. <a href="#alerty">Zobacz alerty</a></p>`);
}

function renderCampaigns() {
  const A = PLAT.ads, cf = state.ads.confirm;
  const row = (c) => {
    const cur = c.spend / c.conv, prev = c.prev_spend / c.prev_conv;
    let h = `<tr${cf && cf.id === c.id ? ' class="own"' : ''}><td><span class="key"><i style="background:${AD_COLOR[c.platform]}"></i><b>${esc(c.name)}</b></span><br><span class="small muted">${esc(platformName(c.platform))}</span></td>

const norm = (s) => s.toLowerCase().replace(/[ąćęłńóśźż]/g, (c) => ({ ą: 'a', ć: 'c', ę: 'e', ł: 'l', ń: 'n', ó: 'o', ś: 's', ź: 'z', ż: 'z' }[c])).replace(/[^a-z0-9]+/g, ' ').trim();
const daysExact = (iso) => (new Date(iso + ':00') - TODAY) / 86400000;

/* Dopasowanie ogłoszenia do profilu. Te same reguły i punkty co w silniku (Matcher::score):
   województwo 10, kod CPV do 60, słowa kluczowe do 40, wartość +10 albo -25, mniej niż 3 dni na ofertę -15. */
function matchTender(t, p) {
  const text = ' ' + norm(t.title + ' ' + t.text) + ' ', reasons = [];
  let score = 0;
  if (p.regions.length) {
    if (!p.regions.includes(t.region)) return { out: 'województwo spoza profilu: ' + t.region };
    score += 10; reasons.push('Województwo: ' + t.region);
  }
  for (const kw of p.exclude) if (text.includes(' ' + norm(kw))) return { out: 'słowo wykluczające: ' + kw };
  let best = 0, code = '';
  for (const raw of p.cpv) {
    const prefix = raw.replace(/\D/g, '').replace(/0+$/, '');
    if (prefix.length < 2) continue;
    for (const c of t.cpv_all) {
      if (!c.startsWith(prefix)) continue;
      const pts = (c === t.cpv_main ? 50 : 38) + Math.min(10, (prefix.length - 2) * 2);
      if (pts > best) { best = pts; code = c; }
    }
  }
  if (best) { score += Math.min(60, best); reasons.push('Kod CPV ' + code + (code === t.cpv_main ? ' (główny)' : '')); }
  const hits = p.keywords.filter((kw) => text.includes(' ' + norm(kw)));
  if (hits.length) { score += Math.min(40, 20 + 10 * (hits.length - 1)); reasons.push('Słowa kluczowe: ' + hits.slice(0, 4).join(', ')); }
  if (!best && !hits.length) return { out: 'brak kodu CPV i słów kluczowych z profilu' };
  if (t.value !== null) {
    if (t.value < p.min || t.value > p.max) { score -= 25; reasons.push('Wartość poza Twoim zakresem'); }
    else { score += 10; reasons.push('Wartość w Twoim zakresie'); }
  }
  if (daysExact(t.deadline) < 3) { score -= 15; reasons.push('Mniej niż 3 dni na ofertę'); }
  return { score: Math.max(0, Math.min(100, score)), reasons };
}
function matchAll() {
  const all = PLAT.tenders.map((t) => ({ t, m: matchTender(t, PLAT.profile) }));
  return { ok: all.filter((x) => !x.m.out).sort((a, b) => b.m.score - a.m.score), out: all.filter((x) => x.m.out) };
}

state.co = { id: 'b2', letter: 0 };
const companyOf = (id) => PLAT.companies.find((c) => c.id === id);
const SIGNAL = { high: ['bad', 'wysoki'], mid: ['mid', 'średni'], info: ['plain', 'informacja'], none: ['good', 'w porządku'] };

/* Ocena ryzyka płatniczego jak w silniku (Risk::assess): 5 punktów na start plus wagi sygnałów, najwyżej 100.
   Tylko dane publiczne. Długów zgłoszonych przez użytkowników tu nie ma. */
function companyRisk(c) {
  const score = Math.max(0, Math.min(100, 5 + c.signals.reduce((a, s) => a + s[4], 0)));
  const [label, cls] = score >= 70 ? ['Wysokie', 'bad'] : (score >= 45 ? ['Podwyższone', 'mid'] : (score >= 20 ? ['Umiarkowane', 'mid'] : ['Niskie', 'good']));
  return { score, label, cls };
}
const overdue = (r) => Math.max(0, -daysTo(r.due));
const addMonth = (iso) => { const [y, m, d] = iso.split('-').map(Number), x = new Date(y, m, d, 12); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; };
/* Warunki wpisu do BIG dla dłużnika niebędącego konsumentem (art. 15 i 15a ustawy), jak w silniku. */
function bigCheck(r) {
  const days = overdue(r), wait = r.demand ? addMonth(r.demand) : null, waitOk = wait !== null && PLAT.today >= wait;
  const checks = [
    [true, 'Należność nie została zapłacona'],
    [r.amount >= 500, 'Łączna kwota zaległości co najmniej 500 zł (dłużnik niebędący konsumentem)'],
    [days >= 30, `Wymagalna od co najmniej 30 dni (teraz: ${dni(days)} po terminie)`],
    [!!r.demand, 'Wysłane wezwanie do zapłaty z ostrzeżeniem o zamiarze przekazania danych do biura i informacją o prawie do sprzeciwu'],
    [!!r.bureau, 'W wezwaniu podano firmę i adres siedziby biura informacji gospodarczej'],
    [waitOk, 'Minął co najmniej miesiąc od wysłania wezwania'],
  ];
  const eligible = checks.every((c) => c[0]);
  return { checks, eligible, days, from: !eligible && wait && !waitOk ? wait : null };
}
const compensation = (amount) => amount <= 5000 ? 40 : (amount < 50000 ? 70 : 100);
function demandLetter(r) {
  const c = companyOf(r.company);
  return [`Wezwanie do zapłaty: faktura ${r.invoice}`,
    `${dpl(PLAT.today)}\n\nWierzyciel: ${PLAT.org.name}\nDłużnik: ${c.name}, NIP ${c.nip}\n\nWEZWANIE DO ZAPŁATY\n\nWzywamy do zapłaty kwoty ${zl(r.amount)} z tytułu faktury nr ${r.invoice} z dnia ${dpl(r.issued)}, której termin płatności upłynął ${dpl(r.due)}, wraz z odsetkami ustawowymi za opóźnienie w transakcjach handlowych oraz rekompensatą za koszty odzyskiwania należności w wysokości równowartości ${compensation(r.amount)} euro, w terminie 7 dni od dnia otrzymania niniejszego wezwania.` +
    (r.bureau ? `\n\nJednocześnie informujemy, że w przypadku braku zapłaty w terminie miesiąca od dnia doręczenia niniejszego wezwania zamierzamy przekazać dane dotyczące zobowiązania do biura informacji gospodarczej: ${r.bureau} (art. 15 ust. 1 pkt 3 ustawy o udostępnianiu informacji gospodarczych i wymianie danych gospodarczych).\n\nInformujemy o możliwości zgłoszenia nam sprzeciwu wobec zamiaru przekazania danych do biura (art. 15a tej ustawy).` : '') +
    `\n\nZ poważaniem\n${PLAT.org.name}`];
}

function rerender(...ids) { for (const { v } of allViews()) if (ids.includes(v.id)) v.render(); drawCharts(); }
function current() {
  const h = location.hash.slice(1), all = allViews();

function setClient(on) {
  document.getElementById('shell').classList.toggle('client', on);
  document.getElementById('clientNote').hidden = !on;
  document.getElementById('clientBtn').textContent = on ? 'Wróć do widoku agencji' : 'Podgląd dla klienta';
}
let lastView = null;
function show() {
  const { m, v } = current();
  if (!m.client) setClient(false);
  for (const x of allViews()) document.getElementById('v-' + x.v.id).hidden = x.v.id !== v.id;
  const nav = document.getElementById('mods');
  for (const a of nav.querySelectorAll('a')) {
    const on = a.dataset.mod === m.id;
    a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
  }
  const tabs = document.getElementById('tabs');
  tabs.hidden = m.views.length < 2;
  tabs.innerHTML = m.views.map((x) => `<a href="#${x.id}"${x.agency ? ' class="agency-only"' : ''}${x.id === v.id ? ' aria-current="page"' : ''}>${esc(x.label)}</a>`).join('');
  document.getElementById('clientBtn').hidden = !m.client;
  const h = m.head(v);
  document.getElementById('crumbs').textContent = h.crumbs;
  document.getElementById('pageTitle').textContent = h.title;
  const meta = document.getElementById('pageMeta');
  meta.hidden = !(h.facts && h.facts.length);
  meta.innerHTML = (h.facts || []).map(([k, val]) => `<div><dt>${esc(k)}</dt><dd>${esc(val)}</dd></div>`).join('');
  const on = nav.querySelector('a.on');
  if (on && (on.offsetLeft < nav.scrollLeft + nav.offsetLeft || on.offsetLeft + on.offsetWidth > nav.offsetLeft + nav.scrollLeft + nav.clientWidth)) nav.scrollLeft = on.offsetLeft - nav.offsetLeft - 16;
  if (lastView && lastView !== v.id) window.scrollTo(0, 0);
  lastView = v.id;
  hideTip(); drawCharts();
}
function renderAll() { for (const { v } of allViews()) v.render(); show(); }
function go(view) { if (location.hash === '#' + view) show(); else location.hash = '#' + view; }

document.getElementById('mods').innerHTML = MODS.map((m) => `<a href="#${m.views[0].id}" data-mod="${m.id}">${esc(m.label)}</a>`).join('');
document.getElementById('views').innerHTML = allViews().map(({ v }) => `<section id="v-${v.id}"${v.gap === 0 ? '' : ` class="stack" style="gap:${v.gap || 36}px"`} aria-label="${esc(v.label)}" hidden></section>`).join('');

document.addEventListener('click', (e) => {
  const act = e.target.closest('[data-act]');
  if (act && ACTIONS[act.dataset.act]) { ACTIONS[act.dataset.act](act, e); return; }
  const b = e.target.closest('[data-audit]');
  if (b) { state.audit = b.dataset.audit; rerender('raport', 'wytyczne', 'postep', 'cytowania', 'strony'); show(); return; }
  const seg = e.target.closest('[data-rule]');
  if (seg) { const row = document.getElementById('r-' + seg.dataset.rule); if (row) { row.open = true; row.scrollIntoView({ block: 'center' }); row.querySelector('summary').focus({ preventScroll: true }); } return; }
  const opt = e.target.closest('[data-opt]');
  if (opt) { state.w.answers.push(Number(opt.dataset.opt)); state.w.step++; renderWidget(); return; }
  if (e.target.closest('[data-skip]')) { state.w.shop = null; state.w.step = 5; renderWidget(); return; }
  if (e.target.closest('[data-restart]')) { state.w = W0(); renderWidget(); return; }
  const note = e.target.closest('[data-note]');
  if (note) note.nextElementSibling.hidden = !note.nextElementSibling.hidden;
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-on]');
  if (el && CHANGES[el.dataset.on]) CHANGES[el.dataset.on](el, e);
});
document.addEventListener('submit', (e) => {
  if (FORMS[e.target.id]) { e.preventDefault(); FORMS[e.target.id](e.target); return; }
  const w = state.w, val = (id) => document.getElementById(id).value.trim();
  if (e.target.id === 'auditForm') { e.preventDefault(); document.getElementById('formNote').hidden = false; }
  if (e.target.id === 'wShop') { e.preventDefault(); w.shop = val('wUrl').slice(0, 120) || null; w.step = 5; renderWidget(); }
  if (e.target.id === 'wAsk') { e.preventDefault(); const t = val('wQ').slice(0, 200); if (t) { w.asked.push(t); renderWidget(); } }
  if (e.target.id === 'wContact') {
    e.preventDefault();
    const email = val('wEmail');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      w.error = 'Podaj adres e-mail, żebyśmy mogli odpowiedzieć.';
      const ids = ['wName', 'wPhone', 'wNip'], keep = ids.map(val), c = document.getElementById('wConsent').checked;
      renderWidget();
      ids.forEach((id, i) => { document.getElementById(id).value = keep[i]; });
      document.getElementById('wConsent').checked = c; document.getElementById('wEmail').focus();
      return;
    }
    w.error = ''; w.email = email.slice(0, 120); w.phone = val('wPhone') !== '';
    LEADS.leads.unshift({
      at: 'przed chwilą', company: 'Zapytanie z podglądu widżetu', person: val('wName').slice(0, 60) || 'Bez imienia', email: w.email, phone: w.phone,
      answers: w.answers.slice(), status: 'Nowe', consent: document.getElementById('wConsent').checked, page: 'podgląd widżetu',
      nip: val('wNip') ? ['plain', 'NIP podany. W panelu sprawdzimy go w wykazie VAT i KRS.'] : null, shop: w.shop, audit: null,
      summary: 'Zapytanie utworzone w podglądzie widżetu. W panelu streszczenie pisze AI na podstawie odpowiedzi.',
    });
    w.step = 6; rerender('zapytania', 'widzet', 'pulpit');
  }
});
document.getElementById('clientBtn').addEventListener('click', () => {
  const on = !document.getElementById('shell').classList.contains('client');
  setClient(on);
  if (on && location.hash === '#strony') location.hash = '#raport';
});
window.addEventListener('hashchange', show);
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCharts, 120); });
renderAll();
</script>
</body>
</html>
