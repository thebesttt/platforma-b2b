# Blueprint Render.com: Dashboard → New → Blueprint → wybierz to repozytorium.
# Tworzy aplikację (Docker) i bazę PostgreSQL. Darmowa baza na Render ma ograniczony czas życia -
# przed startem sprzedaży przejdź na płatny plan bazy albo ustaw DATABASE_URL na bazę w Neon (darmowy plan bez limitu czasu).
databases:
  - name: platforma-db
    plan: free
    region: frankfurt
    databaseName: platforma
    user: platforma

services:
  - type: web
    name: platforma-b2b
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /zdrowie
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: platforma-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: CRON_TOKEN            # ten sam token wpisz w GitHub → Settings → Secrets → CRON_TOKEN (codzienny import)
        generateValue: true
      - key: APP_NAME              # nazwa produktu widoczna w aplikacji
        value: PerfectData
      - key: APP_THEME             # perfectdata = granat i złoto jak na perfectdata.pl; puste = wygląd standardowy
        value: perfectdata
      # Render zapyta o wartości oznaczone „sync: false” przy tworzeniu usługi. Każdą można uzupełnić później w zakładce Environment.
      - key: ANTHROPIC_API_KEY     # klucz API Claude - bez niego działa analiza regułowa, a funkcje AI są wyłączone
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-5-5
      - key: ADMIN_EMAILS          # Twój e-mail: test połączenia z AI i z pocztą, ręczna aktualizacja decyzji UOKiK
        sync: false
      - key: RESEND_API_KEY        # klucz z resend.com - bez niego panel nie wysyła powiadomień o zapytaniach ani linków do hasła
        sync: false
      - key: MAIL_FROM             # nadawca w domenie zweryfikowanej w Resend, np. Panel PerfectData <panel@perfectdata.pl>
        sync: false
      - key: SIGNUP_OPEN           # 0 = rejestracja tylko z linku z kodem (zalecane do czasu regulaminu), 1 = otwarta dla wszystkich
        value: "0"
      - key: SIGNUP_CODE           # kod zaproszenia: konto zakłada się pod adresem /rejestracja?kod=<ta wartość>
        generateValue: true
# Zmienne opcjonalne dodasz później w zakładce Environment: PSI_KEY (klucz Google PageSpeed do audytu szybkości),
# CEIDG_TOKEN (token hurtowni danych CEIDG: wyszukiwanie jednoosobowych działalności po branży i regionie),
# CF_ACCOUNT_ID i CF_BROWSER_TOKEN (Cloudflare Browser Run: wskaźniki A6 i E2 audytu AI),
# TERMS_URL i PRIVACY_URL (adresy regulaminu i polityki prywatności), APP_URL (własna domena).
