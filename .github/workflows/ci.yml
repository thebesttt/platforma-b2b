name: Testy i obraz Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, intl, zip, pdo_sqlite, pdo_pgsql
          coverage: none
      - name: Składnia PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Testy (SQLite)
        run: php tests/run.php
      - name: Testy (PostgreSQL)
        run: php tests/run.php
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test

  docker:
    needs: testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Budowa obrazu
        run: docker build -t platforma-b2b .
      - name: Start bazy i aplikacji (port jak na Render)
        run: |
          docker network create net
          docker run -d --name db --network net -e POSTGRES_PASSWORD=pg -e POSTGRES_DB=platforma postgres:16
          docker run -d --name app --network net -p 10000:10000 \
            -e DATABASE_URL=postgres://postgres:pg@db:5432/platforma -e CRON_TOKEN=ci-token -e APP_SECRET=ci-secret \
            -e SIGNUP_OPEN=0 -e SIGNUP_CODE=ci-kod platforma-b2b
          for i in $(seq 1 60); do curl -fs http://localhost:10000/zdrowie > /dev/null && break; sleep 2; done
      - name: Test dymny
        run: sh tests/smoke.sh http://localhost:10000 ci-kod ci-token
      - name: Kontener bez DATABASE_URL nie startuje
        run: |
          if docker run --rm platforma-b2b true 2> err.txt; then echo "kontener wystartował bez bazy"; exit 1; fi
          grep -q "DATABASE_URL" err.txt
      - name: Tekst z PDF (pdftotext w obrazie)
        run: docker exec app sh -c 'command -v pdftotext'
      - name: Zasoby jak na najmniejszej instancji Render (512 MB RAM, 0,1 CPU)
        run: |
          docker run -d --name maly --network net -p 10001:10000 --memory=512m --memory-swap=512m --cpus=0.1 \
            -e DATABASE_URL=postgres://postgres:pg@db:5432/platforma -e CRON_TOKEN=ci-token -e APP_SECRET=ci-secret \
            -e SIGNUP_OPEN=0 -e SIGNUP_CODE=ci-kod platforma-b2b
          start=$(date +%s)
          for i in $(seq 1 90); do curl -fs http://localhost:10001/zdrowie > /dev/null && break; sleep 2; done
          echo "start aplikacji: $(( $(date +%s) - start )) s"
          start=$(date +%s)
          sh tests/smoke.sh http://localhost:10001 ci-kod ci-token
          echo "test dymny: $(( $(date +%s) - start )) s"
          # 60 zapytań naraz: wszystkie obsłużone, liczba procesów w limicie, bez braku pamięci.
          start=$(date +%s)
          seq 1 60 | xargs -P 30 -I{} curl -s -o /dev/null -m 120 -w "%{http_code}\n" http://localhost:10001/logowanie | sort | uniq -c | tee kody.txt
          echo "60 zapytań: $(( $(date +%s) - start )) s"
          test "$(grep -vc ' 200$' kody.txt)" = "0"
          n=$(docker exec maly sh -c 'grep -lx apache2 /proc/[0-9]*/comm | wc -l')
          echo "procesy apache2: $n"
          test "$n" -le 13
          docker stats --no-stream --format 'pamięć: {{.MemUsage}}' maly
          test "$(docker inspect -f '{{.State.OOMKilled}} {{.State.Running}}' maly)" = "false true"
      - name: Logi kontenera
        if: always()
        run: docker logs app 2>&1 | tail -60
