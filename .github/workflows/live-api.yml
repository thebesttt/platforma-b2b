name: Kontrakt z API (BZP, TED, VAT, KRS, UOKiK)

# Co tydzień i na żądanie: czy publiczne API nie zmieniły formatu odpowiedzi.
on:
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, intl, pdo_sqlite
          coverage: none
      - name: Test kontraktu
        run: php tests/live_contract.php
      - name: Diagnostyka połączenia z rejestrem UOKiK
        if: failure()
        run: |
          getent hosts decyzje.uokik.gov.pl || true
          curl -sv -o /dev/null --connect-timeout 45 --max-time 90 https://decyzje.uokik.gov.pl/bp/dec_prez.nsf 2>&1 | grep -E 'Trying|Connected|SSL|HTTP/|timed out|error' || true
